      async function sbRestFetch(path, options = {}) {
        const headers = {
          apikey: SUPABASE_ANON_KEY,
          'Content-Type': 'application/json',
          ...(options.headers || {}),
        };
        if (options.token) {
          headers['Authorization'] = `Bearer ${options.token}`;
        }
        const res = await fetch(`${SUPABASE_URL}${path}`, {
          method: options.method || 'GET',
          headers,
          body: options.body ? JSON.stringify(options.body) : undefined,
        });
        const text = await res.text();
        let json = null;
        try {
          json = text ? JSON.parse(text) : null;
        } catch (_) {}
        if (!res.ok) {
          const msg =
            (json && (json.msg || json.message || json.error_description || json.error)) ||
            `HTTP ${res.status}`;
          throw new Error(msg);
        }
        return json;
      }

        if (!cloud.refreshToken) return false;

          const data = await sbRestFetch('/auth/v1/token?grant_type=refresh_token', {
            method: 'POST',
            body: { refresh_token: cloud.refreshToken },
          });
          if (data && data.access_token && data.user) {
            cloud.user = data.user;
            cloud.accessToken = data.access_token;
            cloud.refreshToken = data.refresh_token || cloud.refreshToken;
            saveSessionToStorage();
            return true;

        } catch (_) {}
        return false;

          return FIELD_POSITIONS.map((p) => ({ id: p.id, type: p.type, level: 0 }));

        for (let i = 0; i < (dist.iron || 4); i++) types.push('iron');

        return FIELD_POSITIONS.map((p, idx) => ({
          id: p.id,
          type: types[idx] || p.type,
          level: 0,
        }));

        }));

        const list = Array.isArray(rawSlots) ? rawSlots : [];
        return Array.from({ length: 24 }, (_, idx) => {

          const found = list.find((s) => s && s.id === id) || list[idx];
          if (found) {
            return {
              id,
              buildingType: found.buildingType || null,
              level: Number(found.level) || 0,
            };
          }
          return {
            id,
            buildingType: idx === 0 ? 'main_building' : null,
            level: idx === 0 ? 1 : 0,
          };
        });

              if (!AudioCtx) return;
              if (!ctx) ctx = new AudioCtx();
              if (ctx.state === 'suspended') ctx.resume().catch(() => {});
              const now = ctx.currentTime;
              const notes =
                kind === 'alert'
                  ? [587.33, 440, 587.33]
                  : kind === 'defeat'
                  ? [293.66, 220]

              notes.forEach((freq, idx) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = kind === 'alert' ? 'square' : 'triangle';
                osc.frequency.setValueAtTime(freq, now + idx * 0.11);
                gain.gain.setValueAtTime(0.06, now + idx * 0.11);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.11 + 0.18);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now + idx * 0.11);
                osc.stop(now + idx * 0.11 + 0.2);
              });
            } catch (_) {}

        };

      // ======================================================================
      // GERADOR DETERMINÍSTICO DE MAPA (FNV-1a + MULBERRY32)
      // ======================================================================
      function hashSeed(str) {
        let h = 2166136261 >>> 0;
        for (let i = 0; i < str.length; i++) {
          h ^= str.charCodeAt(i);
          h = Math.imul(h, 16777619);
        }
        return h >>> 0;
      }

      function mulberry32(seed) {
        let a = seed >>> 0;
        return function () {
          let t = (a += 0x6d2b79f5);
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      function generateTile(worldSeed, x, y) {
        const rng = mulberry32(hashSeed(`${worldSeed.trim().toUpperCase()}|${x}|${y}`));
        const roll = rng();
        const dist = Math.hypot(x, y);

        if (roll < 0.18) {
          const rRoll = rng();
          const resource =
            rRoll < 0.25 ? 'wood' : rRoll < 0.5 ? 'clay' : rRoll < 0.75 ? 'iron' : 'crop';
          const percent = rng() < 0.28 ? 50 : 25;
          const wildlifeLevel = Math.min(12, Math.max(1, Math.floor(dist / 7) + 1));
          return {
            x,
            y,
            type: 'oasis',
            oasis: {
              resource,
              percent,
              label: `+${percent}% ${FIELD_CONFIG[resource].label}`,
              wildlifeLevel,
            },
          };
        }

        if (roll < 0.27) {
          const level = Math.min(15, Math.max(1, Math.floor(dist / 6) + Math.floor(rng() * 2) + 1));
          const mult = 0.75 + level * 0.48;
          const tribe = TRIBES[Math.floor(rng() * TRIBES.length)];
          return {
            x,
            y,
            type: 'barbarian',
            barbarian: {
              name: `${tribe} Nv.${level}`,
              level,
              defense: Math.round((85 + level * 68) * (0.9 + rng() * 0.25)),
              loot: {
                wood: Math.round((190 + rng() * 230) * mult),
                clay: Math.round((190 + rng() * 230) * mult),
                iron: Math.round((170 + rng() * 210) * mult),
                crop: Math.round((210 + rng() * 260) * mult),
              },
            },
          };
        }

        const vRoll = rng();
        let distCfg = { wood: 4, clay: 4, iron: 4, crop: 6, label: '4-4-4-6', rare: false };
        if (vRoll < 0.05) distCfg = { wood: 1, clay: 1, iron: 1, crop: 15, label: '15-Cereais', rare: true };
        else if (vRoll < 0.16) distCfg = { wood: 3, clay: 3, iron: 3, crop: 9, label: '9-Cereais', rare: true };
        else if (vRoll < 0.34) distCfg = { wood: 5, clay: 4, iron: 3, crop: 6, label: '5-4-3-6', rare: false };
        else if (vRoll < 0.52) distCfg = { wood: 3, clay: 5, iron: 4, crop: 6, label: '3-5-4-6', rare: false };
        else if (vRoll < 0.7) distCfg = { wood: 4, clay: 3, iron: 5, crop: 6, label: '4-3-5-6', rare: false };

        return { x, y, type: 'valley', valley: distCfg };
      }

      function getSpawnCoords(seed) {
        const rng = mulberry32(hashSeed(`${seed.trim().toUpperCase()}|PLAYER_SPAWN`));
        return {
          x: Math.floor(rng() * 111) - 55,
          y: Math.floor(rng() * 111) - 55,
        };
      }

      function createVillage(id, name, x, y, dist) {
        return {
          id,
          name,
          x,
          y,
          oases: [],
          resources: { wood: 750, clay: 750, iron: 750, crop: 750 },
          fields: makeFields(dist),
          slots: makeSlots(),
          queue: [],
          troops: makeTroops(),
          training: [],
        };
      }

      function createInitialState(seed = DEFAULT_SEED, capName = 'Roma (Capital)') {
        const cleanSeed = (seed || DEFAULT_SEED).trim().toUpperCase();
        const spawn = getSpawnCoords(cleanSeed);
        const v1 = createVillage('v_1', (capName || 'Roma (Capital)').trim(), spawn.x, spawn.y);
        const now = Date.now();
        return {
          worldSeed: cleanSeed,
          peaceEndsAt: now + PEACE_PERIOD_MS,
          activeVillageId: v1.id,
          villages: [v1],
          barbarianStates: {},
          incomingAttacks: [],
          nextRaidCheckAt: now + PEACE_PERIOD_MS + 90000,
          marches: [],
          tradeCaravans: [],
          alliance: null,
          reports: [],
          soundEnabled: true,
          lastUpdated: now,
        };
      }

      function getCapacities(village) {
        let wBonus = 0,
          gBonus = 0,
          cranny = 0,
          mbLvl = 1,
          marketLvl = 0,
          embassyLvl = 0,
          barracksLvl = 0,
          resLvl = 0;
        for (const s of village.slots) {
          if (!s.buildingType || s.level <= 0) continue;
          if (s.buildingType === 'warehouse') wBonus += STORAGE_BONUS_TABLE[s.level] || 0;
          if (s.buildingType === 'granary') gBonus += STORAGE_BONUS_TABLE[s.level] || 0;
          if (s.buildingType === 'cranny') cranny += Math.round(150 * Math.pow(1.334, s.level - 1));
          if (s.buildingType === 'main_building') mbLvl = Math.max(mbLvl, s.level);
          if (s.buildingType === 'marketplace') marketLvl = Math.max(marketLvl, s.level);
          if (s.buildingType === 'embassy') embassyLvl = Math.max(embassyLvl, s.level);
          if (s.buildingType === 'barracks') barracksLvl = Math.max(barracksLvl, s.level);
          if (s.buildingType === 'residence') resLvl = Math.max(resLvl, s.level);
        }
        const speedMult = Math.max(0.5, 1 - Math.min(40, (mbLvl - 1) * 4) / 100);
        const merchantCap = marketLvl > 0 ? marketLvl * 750 : 0;
        return {
          warehouse: BASE_STORAGE + wBonus,
          granary: BASE_STORAGE + gBonus,
          cranny,
          mbLvl,
          marketLvl,
          merchantCap,
          embassyLvl,
          barracksLvl,
          resLvl,
          speedMult,
        };
      }

      function getHourlyProd(village, worldSeed, alliance) {
        const base = { wood: 0, clay: 0, iron: 0, crop: 0 };
        for (const f of village.fields) {
          base[f.type] += FIELD_PROD_TABLE[f.level] || 5;
        }
        const alBonus = getAllianceBonuses(alliance).prodPct;
        const bonus = { wood: alBonus, clay: alBonus, iron: alBonus, crop: alBonus };
        for (const key of village.oases || []) {
          const [ox, oy] = key.split(',').map(Number);
          const tile = generateTile(worldSeed, ox, oy);
          if (tile.type === 'oasis' && tile.oasis) {
            bonus[tile.oasis.resource] += tile.oasis.percent;
          }
        }
        let upkeep = 0;
        for (const u of UNIT_ORDER) {
          upkeep += (village.troops[u] || 0) * UNIT_CONFIG[u].upkeep;
        }
        return {
          wood: Math.round(base.wood * (1 + bonus.wood / 100)),
          clay: Math.round(base.clay * (1 + bonus.clay / 100)),
          iron: Math.round(base.iron * (1 + bonus.iron / 100)),
          crop: Math.round(base.crop * (1 + bonus.crop / 100)) - upkeep,
          upkeep,
        };
      }

      function fieldCost(type, lvl) {
        const c = FIELD_CONFIG[type];
        const m = Math.pow(c.costMult, Math.max(0, lvl - 1));
        return {
          wood: Math.round(c.baseCost.wood * m),
          clay: Math.round(c.baseCost.clay * m),
          iron: Math.round(c.baseCost.iron * m),
          crop: Math.round(c.baseCost.crop * m),
        };
      }

      function fieldSec(type, lvl, speedMult) {
        const c = FIELD_CONFIG[type];
        const lvlIdx = Math.max(0, lvl - 1);
        const progressiveFactor = 1 + lvlIdx * 0.14;
        return Math.max(2, Math.round(c.baseTime * Math.pow(c.timeMult, lvlIdx) * progressiveFactor * speedMult));
      }

      function bldCost(type, lvl) {
        const c = BUILDING_CONFIG[type];
        const m = Math.pow(1.58, Math.max(0, lvl - 1));
        return {
          wood: Math.round(c.baseCost.wood * m),
          clay: Math.round(c.baseCost.clay * m),
          iron: Math.round(c.baseCost.iron * m),
          crop: Math.round(c.baseCost.crop * m),
        };
      }

      function bldSec(type, lvl, speedMult) {
        const c = BUILDING_CONFIG[type];
        return Math.max(3, Math.round(c.baseTime * Math.pow(1.44, Math.max(0, lvl - 1)) * speedMult));
      }

      function canAfford(res, cost) {
        return res.wood >= cost.wood && res.clay >= cost.clay && res.iron >= cost.iron && res.crop >= cost.crop;
      }

      function subRes(res, cost) {
        return {
          wood: Math.max(0, res.wood - cost.wood),
          clay: Math.max(0, res.clay - cost.clay),
          iron: Math.max(0, res.iron - cost.iron),
          crop: Math.max(0, res.crop - cost.crop),
        };
      }

      function fmtNum(n) {
        return Math.floor(n).toLocaleString('pt-BR');
      }

      function fmtTime(sec) {
        const s = Math.max(0, Math.floor(sec));
        const h = Math.floor(s / 3600);
        const m = Math.floor((s % 3600) / 60);
        const ss = s % 60;
        if (h > 0) return `${h}h ${String(m).padStart(2, '0')}m ${String(ss).padStart(2, '0')}s`;
        return `${String(m).padStart(2, '0')}:${String(ss).padStart(2, '0')}`;
      }

      function getRegen(barbStates, x, y, nowMs) {
        const entry = barbStates[`${x},${y}`];
        if (!entry) return 1;
        return Math.min(1, Math.max(0.15, (nowMs - entry.lastRaidedAt) / (4 * 3600000)));
      }

      function checkReqs(bType, village) {
        const cfg = BUILDING_CONFIG[bType];
        const reqStatus = cfg.reqs.map((r) => {
          if (r.b) {
            const maxL = village.slots.filter((s) => s.buildingType === r.b).reduce((m, s) => Math.max(m, s.level), 0);
            return { label: r.label, ok: maxL >= r.lvl };
          }
          const maxF = village.fields.filter((f) => f.type === r.f).reduce((m, f) => Math.max(m, f.level), 0);
          return { label: r.label, ok: maxF >= r.lvl };
        });
        const unlocked = reqStatus.every((x) => x.ok);
        const existing = village.slots.filter((s) => s.buildingType === bType);
        let canBuild = unlocked;
        let reason = '';
        if (!unlocked) {
          canBuild = false;
          reason = 'Pré-requisitos pendentes';
        } else if (!cfg.allowMultiple && existing.length > 0) {
          canBuild = false;
          reason = 'Já construído nesta aldeia';
        } else if (cfg.allowMultiple && existing.length > 0 && existing.some((s) => s.level < MAX_BUILDING_LEVEL)) {
          canBuild = false;
          reason = `Evolua o ${cfg.name} atual até Nv. 10`;
        }
        return { unlocked, canBuild, reason, reqStatus };
      }

      // ======================================================================
      // MOTOR DE SIMULAÇÃO EM TEMPO REAL (VELOCIDADE FIXA 1X)
      // ======================================================================
      function stepSimulation(prev, targetNow) {
        const elapsedMs = Math.max(0, targetNow - prev.lastUpdated);
        if (elapsedMs <= 0) return { state: { ...prev, timeScale: 1, lastUpdated: targetNow }, event: null };
        const endCursor = prev.lastUpdated + elapsedMs;

        const villages = prev.villages.map((v) => ({
          ...v,
          oases: [...(v.oases || [])],
          resources: { ...v.resources },
          fields: v.fields.map((f) => ({ ...f })),
          slots: normalizeSlots(v.slots),
          queue: v.queue.map((q) => ({ ...q })),
          troops: makeTroops(v.troops),
          training: v.training.map((t) => ({ ...t })),
        }));

        const nextBarbarianStates = { ...(prev.barbarianStates || {}) };
        let marches = (prev.marches || []).map((m) => ({ ...m, troops: makeTroops(m.troops), loot: { ...m.loot } }));
        let caravans = (prev.tradeCaravans || []).map((c) => ({ ...c, cargo: { ...c.cargo } }));
        let incoming = (prev.incomingAttacks || []).map((a) => ({ ...a }));
        let nextRaid = prev.nextRaidCheckAt || prev.lastUpdated + 120000;
        const reports = [...(prev.reports || [])];
        const alliance = prev.alliance ? { ...prev.alliance, members: [...(prev.alliance.members || [])] } : null;
        let event = null;

        // 1. Treinamento de tropas (suporta lotes de 1 ou vários soldados)
        for (const v of villages) {
          const nextTrn = [];
          for (const item of v.training) {
            const done = Math.min(item.count, Math.floor(Math.max(0, endCursor - item.startedAt) / Math.max(250, item.perUnitMs)));
            const newly = Math.max(0, done - item.completedCount);
            if (newly > 0) {
              v.troops[item.unitType] = (v.troops[item.unitType] || 0) + newly;
              cloud.dirty = true;
              if (!event && done === item.count) {
                const uCfg = UNIT_CONFIG[item.unitType];
                event = {
                  sound: 'build',
                  toast: `${uCfg.icon} Treino concluído: +${item.count} ${uCfg.name}!`,
                };
              }
            }
            if (done < item.count) nextTrn.push({ ...item, completedCount: done });
          }
          v.training = nextTrn;
        }

        // 2. Caravanas comerciais entre aldeias
        const keptCaravans = [];
        for (const c of caravans) {
          if (endCursor >= c.arrivesAt) {
            cloud.dirty = true;
            const dest = villages.find((v) => v.id === c.toVillageId) || villages[0];
            const cap = getCapacities(dest);
            dest.resources.wood = Math.min(cap.warehouse, dest.resources.wood + (c.cargo.wood || 0));
            dest.resources.clay = Math.min(cap.warehouse, dest.resources.clay + (c.cargo.clay || 0));
            dest.resources.iron = Math.min(cap.warehouse, dest.resources.iron + (c.cargo.iron || 0));
            dest.resources.crop = Math.min(cap.granary, dest.resources.crop + (c.cargo.crop || 0));
            reports.unshift({
              id: `r_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
              ts: c.arrivesAt,
              title: `Caravana Comercial: ${c.fromName} → ${dest.name}`,
              kind: 'trade',
              outcome: 'victory',
              info: `Entrega concluída: +${fmtNum(c.cargo.wood)} Mad, +${fmtNum(c.cargo.clay)} Bar, +${fmtNum(c.cargo.iron)} Fer, +${fmtNum(c.cargo.crop)} Cer.`,
            });
            if (!event) {
              event = { sound: 'build', toast: `Mercadores chegaram em ${dest.name}!` };
            }
          } else {
            keptCaravans.push(c);
          }
        }
        caravans = keptCaravans;

        // 3. Marchas militares e colonização
        const keptMarches = [];
        const atkBonusMult = 1 + getAllianceBonuses(alliance).atkPct / 100;
        for (let m of marches) {
          const origin = villages.find((v) => v.id === m.originVillageId) || villages[0];
          if (m.status === 'outgoing' && endCursor >= m.arrivesAt) {
            cloud.dirty = true;
            const tile = generateTile(prev.worldSeed, m.targetX, m.targetY);
            if (m.mission === 'settle' && m.troops.settler >= 3 && tile.type === 'valley') {
              const colNum = villages.length + 1;
              const colName = `Colônia ${colNum} (${m.targetX}|${m.targetY})`;
              villages.push(createVillage(`v_${Date.now()}_${colNum}`, colName, m.targetX, m.targetY, tile.valley));
              reports.unshift({
                id: `r_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
                ts: m.arrivesAt,
                title: `${colName} (${m.targetX}|${m.targetY})`,
                kind: 'settle',
                outcome: 'victory',
                info: `Nova aldeia fundada com sucesso (${tile.valley.label})! Selecione-a no topo para alternar.`,
              });
              event = { sound: 'victory', toast: `Nova aldeia fundada: ${colName}!` };
              continue;
            }

            let baseAtkPow = 0;
            for (const u of UNIT_ORDER) baseAtkPow += (m.troops[u] || 0) * UNIT_CONFIG[u].atk;
            const atkPow = Math.round(baseAtkPow * atkBonusMult);

            const regen = getRegen(nextBarbarianStates, m.targetX, m.targetY, m.arrivesAt);
            const defPow =
              tile.type === 'barbarian' && tile.barbarian
                ? Math.max(20, Math.round(tile.barbarian.defense * regen))
                : tile.type === 'oasis' && tile.oasis
                ? 70 + tile.oasis.wildlifeLevel * 55
                : 60;

            const ratio = atkPow / Math.max(1, defPow);
            const won = ratio >= 1;
            const lossRate = won ? Math.min(0.65, 0.4 / Math.pow(ratio, 1.3)) : 0.85;
            const surv = makeTroops();
            let carry = 0;
            for (const u of UNIT_ORDER) {
              const lost = Math.min(m.troops[u] || 0, Math.round((m.troops[u] || 0) * lossRate));
              surv[u] = Math.max(0, (m.troops[u] || 0) - lost);
              carry += surv[u] * UNIT_CONFIG[u].carry;
            }

            const availLoot =
              tile.type === 'barbarian' && tile.barbarian
                ? {
                    wood: Math.round(tile.barbarian.loot.wood * regen),
                    clay: Math.round(tile.barbarian.loot.clay * regen),
                    iron: Math.round(tile.barbarian.loot.iron * regen),
                    crop: Math.round(tile.barbarian.loot.crop * regen),
                  }
                : { wood: 180, clay: 180, iron: 160, crop: 200 };

            const sumLoot = availLoot.wood + availLoot.clay + availLoot.iron + availLoot.crop;
            const takeRatio = won && sumLoot > 0 ? Math.min(1, carry / sumLoot) : 0;
            const loot = {
              wood: Math.floor(availLoot.wood * takeRatio),
              clay: Math.floor(availLoot.clay * takeRatio),
              iron: Math.floor(availLoot.iron * takeRatio),
              crop: Math.floor(availLoot.crop * takeRatio),
            };

            let oasisMsg = '';
            const key = `${m.targetX},${m.targetY}`;
            if (m.mission === 'oasis' && won && tile.type === 'oasis' && !origin.oases.includes(key) && origin.oases.length < 3) {
              origin.oases.push(key);
              oasisMsg = ` • Oásis conquistado (${tile.oasis.label})!`;
            }
            if (m.mission === 'raid' && won) {
              nextBarbarianStates[key] = { lastRaidedAt: m.arrivesAt };
            }

            reports.unshift({
              id: `r_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
              ts: m.arrivesAt,
              title: `${m.targetName} (${m.targetX}|${m.targetY})`,
              kind: 'battle',
              outcome: won ? 'victory' : 'defeat',
              info: `Ataque ${atkPow} vs Defesa ${defPow}. Saque: +${loot.wood} Mad, +${loot.clay} Bar, +${loot.iron} Fer, +${loot.crop} Cer${oasisMsg}`,
            });
            event = {
              sound: won ? 'victory' : 'defeat',
              toast: won ? `Vitória em (${m.targetX}|${m.targetY})!` : `Derrota em (${m.targetX}|${m.targetY})!`,
            };

            const totalSurv = UNIT_ORDER.reduce((s, u) => s + surv[u], 0);
            if (totalSurv > 0) {
              m = { ...m, status: 'returning', troops: surv, loot, departedAt: m.arrivesAt, arrivesAt: m.arrivesAt + m.travelMs };
            } else {
              continue;
            }
          }

          if (m.status === 'returning' && endCursor >= m.arrivesAt) {
            cloud.dirty = true;
            const cap = getCapacities(origin);
            for (const u of UNIT_ORDER) origin.troops[u] = (origin.troops[u] || 0) + (m.troops[u] || 0);
            origin.resources.wood = Math.min(cap.warehouse, origin.resources.wood + m.loot.wood);
            origin.resources.clay = Math.min(cap.warehouse, origin.resources.clay + m.loot.clay);
            origin.resources.iron = Math.min(cap.warehouse, origin.resources.iron + m.loot.iron);
            origin.resources.crop = Math.min(cap.granary, origin.resources.crop + m.loot.crop);
            continue;
          }
          keptMarches.push(m);
        }
        marches = keptMarches;

        // 4. Ataques recebidos
        const keptInc = [];
        for (const a of incoming) {
          if (endCursor >= a.impactsAt) {
            cloud.dirty = true;
            const tv = villages.find((v) => v.id === a.targetVillageId) || villages[0];
            const cap = getCapacities(tv);
            let defPow = 40;
            for (const u of UNIT_ORDER) defPow += (tv.troops[u] || 0) * UNIT_CONFIG[u].def;
            const won = defPow >= a.atkPower;
            if (!won) {
              const factor = 0.25;
              tv.resources.wood = Math.max(0, tv.resources.wood - Math.floor(Math.max(0, tv.resources.wood - cap.cranny) * factor));
              tv.resources.clay = Math.max(0, tv.resources.clay - Math.floor(Math.max(0, tv.resources.clay - cap.cranny) * factor));
              tv.resources.iron = Math.max(0, tv.resources.iron - Math.floor(Math.max(0, tv.resources.iron - cap.cranny) * factor));
              tv.resources.crop = Math.max(0, tv.resources.crop - Math.floor(Math.max(0, tv.resources.crop - cap.cranny) * factor));
            }
            reports.unshift({
              id: `r_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
              ts: a.impactsAt,
              title: `Invasão em ${tv.name} (${tv.x}|${tv.y})`,
              kind: 'defense',
              outcome: won ? 'victory' : 'defeat',
              info: won ? `${a.attacker} repelido pela defesa (${defPow} vs ${a.atkPower}).` : `${a.attacker} saqueou parte dos recursos.`,
            });
            event = { sound: won ? 'victory' : 'defeat', toast: won ? `Defesa bem-sucedida em ${tv.name}!` : `${tv.name} sofreu saque inimigo!` };
          } else {
            keptInc.push(a);
          }
        }
        incoming = keptInc;

        if (endCursor >= nextRaid && incoming.length === 0) {
          if (endCursor < (prev.peaceEndsAt || 0)) {
            nextRaid = prev.peaceEndsAt + 90000;
          } else {
            nextRaid = endCursor + 180000;
            const tv = villages[Math.floor(Math.random() * villages.length)];
            const totalLvls = tv.fields.reduce((s, f) => s + f.level, 0);
            if (totalLvls >= 6) {
              const tribe = TRIBES[Math.floor(Math.random() * TRIBES.length)];
              incoming.push({
                id: `inc_${Date.now()}`,
                targetVillageId: tv.id,
                attacker: tribe,
                atkPower: 70 + totalLvls * 12,
                impactsAt: endCursor + 70000,
              });
              event = { sound: 'alert', toast: `ALERTA: ${tribe} marchando contra ${tv.name}!` };
            }
          }
        }

        // 5. Produção por hora e conclusão de obras
        for (const v of villages) {
          let cursor = prev.lastUpdated;
          const addProd = (ms) => {
            if (ms <= 0) return;
            const hrs = ms / 3600000;
            const prod = getHourlyProd(v, prev.worldSeed, alliance);
            const cap = getCapacities(v);
            v.resources.wood = Math.max(0, Math.min(cap.warehouse, v.resources.wood + prod.wood * hrs));
            v.resources.clay = Math.max(0, Math.min(cap.warehouse, v.resources.clay + prod.clay * hrs));
            v.resources.iron = Math.max(0, Math.min(cap.warehouse, v.resources.iron + prod.iron * hrs));
            v.resources.crop = Math.max(0, Math.min(cap.granary, v.resources.crop + prod.crop * hrs));
          };
          const nextQ = [];
          for (const q of v.queue) {
            if (q.endsAt <= endCursor) {
              cloud.dirty = true;
              if (q.endsAt > cursor) {
                addProd(q.endsAt - cursor);
                cursor = q.endsAt;
              }
              if (q.kind === 'field') {
                const f = v.fields.find((x) => x.id === q.targetId);
                if (f) {
                  f.level = q.targetLevel;
                  if (!event) event = { sound: 'build', toast: `${FIELD_CONFIG[f.type].fieldName} #${f.id} → Nv.${f.level}!` };
                }
              } else {
                const s = v.slots.find((x) => x.id === q.targetId);
                if (s && q.bType) {
                  s.buildingType = q.bType;
                  s.level = q.targetLevel;
                  if (!event) event = { sound: 'build', toast: `${BUILDING_CONFIG[q.bType].name} → Nv.${s.level}!` };
                }
              }
            } else {
              nextQ.push(q);
            }
          }
          if (endCursor > cursor) addProd(endCursor - cursor);
          v.queue = nextQ;
        }

        return {
          state: {
            ...prev,
            villages,
            barbarianStates: nextBarbarianStates,
            incomingAttacks: incoming,
            nextRaidCheckAt: nextRaid,
            marches,
            tradeCaravans: caravans,
            alliance,
            reports: reports.slice(0, 30),
            timeScale: 1,
            lastUpdated: targetNow,
          },
          event,
        };
      }

      // ======================================================================
      // INICIALIZAÇÃO DO SAVE LOCAL + SINCRONIZAÇÃO SUPABASE REST
      // ======================================================================
      let state = createInitialState();
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.villages) && parsed.villages.length > 0) {
            if (typeof parsed.peaceEndsAt !== 'number') parsed.peaceEndsAt = 0;
            if (!Array.isArray(parsed.tradeCaravans)) parsed.tradeCaravans = [];
            if (parsed.alliance === undefined) parsed.alliance = null;
            parsed.timeScale = 1;
            state = stepSimulation(parsed, Date.now()).state;
          }
        }
      } catch (_) {}

      let ui = {
        tab: 'fields',
        selectedFieldId: 1,
        selectedSlotId: 1,
        mapCenter: { x: state.villages[0].x, y: state.villages[0].y },
        inspectedTile: null,
        toast: null,
        showSave: false,
        saveText: '',
        catalogScrollTop: 0,
        authEmail: '',
        authPassword: '',
        authLoading: false,
        trainQty: {
          legionnaire: 1,
          spearman: 1,
          praetorian: 1,
          equites: 1,
          scout: 1,
          catapult: 1,
          settler: 1,
        },
        tradeTargetId: '',
        tradeWood: 0,
        tradeClay: 0,
        tradeIron: 0,
        tradeCrop: 0,
        swapFrom: 'wood',
        swapTo: 'crop',
        swapAmount: 200,
        allianceNameDraft: '',
        allianceTagDraft: '',
        donateAmount: 500,
      };

      function setToast(msg, isErr = false) {
        ui.toast = { msg, isErr };
        render();
        setTimeout(() => {
          ui.toast = null;
          render();
        }, 4200);
      }

      function getActiveVillage() {
        return state.villages.find((v) => v.id === state.activeVillageId) || state.villages[0];
      }

      function saveLocal() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (_) {}
      }

      async function pushCloudSave(forceToast = false) {
        if (!isSupabaseConfigured || !cloud.user || !cloud.accessToken) return;
        cloud.status = 'syncing';
        if (forceToast) render();
        try {
          const payload = {
            user_id: cloud.user.id,
            game_data: state,
            updated_at: new Date().toISOString(),
          };
          try {
            await sbRestFetch('/rest/v1/player_saves?on_conflict=user_id', {
              method: 'POST',
              token: cloud.accessToken,
              headers: { Prefer: 'resolution=merge-duplicates,return=minimal' },
              body: payload,
            });
          } catch (firstErr) {
            const refreshed = await refreshCloudSession();
            if (!refreshed) throw firstErr;
            await sbRestFetch('/rest/v1/player_saves?on_conflict=user_id', {
              method: 'POST',
              token: cloud.accessToken,
              headers: { Prefer: 'resolution=merge-duplicates,return=minimal' },
              body: payload,
            });
          }
          cloud.status = 'synced';
          cloud.lastSyncedAt = Date.now();
          cloud.lastError = '';
          cloud.dirty = false;
          if (forceToast) setToast('Progresso salvo na nuvem!');
        } catch (err) {
          cloud.status = 'error';
          cloud.lastError = err.message || 'Erro desconhecido';
          if (forceToast) setToast('Erro ao salvar na nuvem: ' + cloud.lastError, true);
        }
        render();
      }

      async function pullCloudSave(forceToast = false) {
        if (!isSupabaseConfigured || !cloud.user || !cloud.accessToken) return;
        cloud.status = 'syncing';
        render();
        try {
          let rows = null;
          try {
            rows = await sbRestFetch(
              `/rest/v1/player_saves?user_id=eq.${encodeURIComponent(cloud.user.id)}&select=game_data,updated_at`,
              { method: 'GET', token: cloud.accessToken }
            );
          } catch (firstErr) {
            const refreshed = await refreshCloudSession();
            if (!refreshed) throw firstErr;
            rows = await sbRestFetch(
              `/rest/v1/player_saves?user_id=eq.${encodeURIComponent(cloud.user.id)}&select=game_data,updated_at`,
              { method: 'GET', token: cloud.accessToken }
            );
          }

          const row = Array.isArray(rows) && rows.length > 0 ? rows[0] : null;
          if (row && row.game_data && Array.isArray(row.game_data.villages) && row.game_data.villages.length > 0) {
            const cloudState = row.game_data;
            const localLvls = state.villages.reduce((acc, vl) => acc + vl.fields.reduce((s, f) => s + f.level, 0), 0);
            const cloudLvls = cloudState.villages.reduce((acc, vl) => acc + vl.fields.reduce((s, f) => s + f.level, 0), 0);

            if (forceToast || cloudLvls > 0 || localLvls === 0 || (cloudState.lastUpdated || 0) >= (state.lastUpdated || 0)) {
              if (typeof cloudState.peaceEndsAt !== 'number') cloudState.peaceEndsAt = 0;
              if (!Array.isArray(cloudState.tradeCaravans)) cloudState.tradeCaravans = [];
              if (cloudState.alliance === undefined) cloudState.alliance = null;
              cloudState.timeScale = 1;
              state = stepSimulation(cloudState, Date.now()).state;
              const av = getActiveVillage();
              ui.mapCenter = { x: av.x, y: av.y };
              saveLocal();
              setToast('Progresso restaurado da nuvem!');
            } else {
              await pushCloudSave(false);
            }
          } else {
            await pushCloudSave(false);
          }
          cloud.status = 'synced';
          cloud.lastSyncedAt = Date.now();
          cloud.lastError = '';
        } catch (err) {
          cloud.status = 'error';
          cloud.lastError = err.message || 'Falha ao sincronizar';
          setToast('Falha ao carregar da nuvem: ' + cloud.lastError, true);
        }
        render();
      }

      async function signInWithEmail(email, password) {
        if (!isSupabaseConfigured) {
          setToast('Configure a chave do Supabase no topo do index.html.', true);
          return;
        }
        if (!email || !password) {
          setToast('Preencha seu e-mail e sua senha.', true);
          return;
        }
        ui.authLoading = true;
        cloud.lastError = '';
        render();
        try {
          const data = await sbRestFetch('/auth/v1/token?grant_type=password', {
            method: 'POST',
            body: { email: email.trim(), password },
          });
          ui.authLoading = false;
          if (data && data.access_token && data.user) {
            cloud.user = data.user;
            cloud.accessToken = data.access_token;
            cloud.refreshToken = data.refresh_token || null;
            saveSessionToStorage();
            ui.showSave = false;
            setToast('Conectado! Carregando seu save...');
            await pullCloudSave(false);
          } else {
            setToast('Resposta inesperada ao entrar.', true);
          }
        } catch (err) {
          ui.authLoading = false;
          cloud.lastError = err.message || 'Failed to fetch';
          setToast(`Erro ao entrar (${cloud.lastError}).`, true);
        }
        render();
      }

      async function signUpWithEmail(email, password) {
        if (!isSupabaseConfigured) {
          setToast('Configure a chave do Supabase no topo do index.html.', true);
          return;
        }
        if (!email || password.length < 6) {
          setToast('Digite um e-mail válido e uma senha com pelo menos 6 caracteres.', true);
          return;
        }
        ui.authLoading = true;
        cloud.lastError = '';
        render();
        try {
          const data = await sbRestFetch('/auth/v1/signup', {
            method: 'POST',
            body: { email: email.trim(), password },
          });
          ui.authLoading = false;
          if (data && data.access_token && data.user) {
            cloud.user = data.user;
            cloud.accessToken = data.access_token;
            cloud.refreshToken = data.refresh_token || null;
            saveSessionToStorage();
            ui.showSave = false;
            setToast('Conta criada e conectada! Salvando progresso...');
            await pushCloudSave(false);
          } else {
            setToast('Conta criada! Desative "Confirm email" no Supabase e clique em Entrar.');
          }
        } catch (err) {
          ui.authLoading = false;
          cloud.lastError = err.message || 'Failed to fetch';
          setToast(`Erro ao criar conta (${cloud.lastError}).`, true);
        }
        render();
      }

      function logoutAccount() {
        cloud.user = null;
        cloud.accessToken = null;
        cloud.refreshToken = null;
        cloud.status = 'disconnected';
        saveSessionToStorage();
        setToast('Você saiu da sua conta.');
      }

      function saveNow(markCloudDirty = true) {
        saveLocal();
        if (markCloudDirty && cloud.user) {
          cloud.dirty = true;
          pushCloudSave(false);
        }
      }

      try {
        const savedSess = localStorage.getItem(SESSION_KEY);
        if (savedSess && isSupabaseConfigured) {
          const parsedSess = JSON.parse(savedSess);
          if (parsedSess && parsedSess.user && parsedSess.accessToken) {
            cloud.user = parsedSess.user;
            cloud.accessToken = parsedSess.accessToken;
            cloud.refreshToken = parsedSess.refreshToken || null;
            setTimeout(() => pullCloudSave(false), 300);
          }
        }
      } catch (_) {}

      // RENDERIZAÇÃO DA INTERFACE
      // ======================================================================
