                  <div class="flex items-center justify-between">
                    <h3 class="font-bold text-sm text-stone-800">Mercador Viajante (Taxa 200 por 150)</h3>
                    <span class="px-2 py-0.5 rounded bg-amber-100 text-amber-900 font-bold text-[11px]">Proporção 75%</span>
                  </div>
                  <p class="text-stone-500">Troque excedentes com os mercadores da estrada na proporção de <strong>200 entregues por 150 recebidos</strong> (limite por viagem: ${fmtNum(cap.merchantCap)}).</p>
                  <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                    <select id="swapFromSel" class="px-2.5 py-2 rounded-lg border border-stone-300 font-bold">
                      ${['wood', 'clay', 'iron', 'crop']
                        .map((rk) => `<option value="${rk}" ${ui.swapFrom === rk ? 'selected' : ''}>Entregar: ${FIELD_CONFIG[rk].label}</option>`)
                        .join('')}
                    </select>
                    <select id="swapToSel" class="px-2.5 py-2 rounded-lg border border-stone-300 font-bold">
                      ${['wood', 'clay', 'iron', 'crop']
                        .map((rk) => `<option value="${rk}" ${ui.swapTo === rk ? 'selected' : ''}>Receber: ${FIELD_CONFIG[rk].label}</option>`)
                        .join('')}
                    </select>
                    <input id="swapAmountInput" type="number" min="4" step="20" max="${Math.max(4, cap.merchantCap)}" value="${swapAmt}" class="px-2.5 py-2 rounded-lg border border-stone-300 font-mono font-bold" />
                  </div>
                  <button id="btnExecuteSwap" ${canSwap ? '' : 'disabled'} class="w-full py-2.5 rounded-xl font-bold cursor-pointer ${canSwap ? 'bg-amber-600 hover:bg-amber-500 text-white' : 'bg-stone-200 text-stone-400 cursor-not-allowed'}">
                    🔄 Trocar ${fmtNum(swapAmt)} ${FIELD_CONFIG[ui.swapFrom].label} por ${fmtNum(swapReceived)} ${FIELD_CONFIG[ui.swapTo].label}
                  </button>
                </div>
              </div>

              <div class="lg:col-span-5 bg-white rounded-xl border border-stone-300 p-4 shadow-sm space-y-2.5">
                <h3 class="font-bold text-sm text-stone-800">Caravanas em Trânsito (${(state.tradeCaravans || []).length})</h3>
                ${
                  (state.tradeCaravans || []).length === 0
                    ? `<p class="text-xs text-stone-500">Nenhuma caravana na estrada no momento.</p>`
                    : state.tradeCaravans
                        .map((c) => {
                          const rem = Math.max(0, Math.ceil((c.arrivesAt - now) / 1000));
                          return `<div class="p-3 rounded-xl bg-cyan-50/70 border border-cyan-200 text-xs space-y-1">
                            <div class="flex justify-between font-bold text-cyan-950">
                              <span>🚚 ${c.fromName} → ${c.toName}</span>
                              <span class="font-mono">${fmtTime(rem)}</span>
                            </div>
                            <div class="text-stone-600">Carga: ${fmtNum(c.cargo.wood)} Mad • ${fmtNum(c.cargo.clay)} Bar • ${fmtNum(c.cargo.iron)} Fer • ${fmtNum(c.cargo.crop)} Cer</div>
                          </div>`;
                        })
                        .join('')
                }
              </div>
            </div>
          `;
        }

        // ====================================================================
        // ABA ALIANÇAS
        // ====================================================================
        if (ui.tab === 'alliance') {
          const hasEmbassy = cap.embassyLvl > 0;
          const al = state.alliance;
          const nextXp = al ? getAllianceNextXp(al.level) : 1500;
          const xpPct = al ? Math.min(100, Math.round((al.xp / Math.max(1, nextXp)) * 100)) : 0;
          const donAmt = Number(ui.donateAmount) || 500;
          const donCost = { wood: donAmt, clay: donAmt, iron: donAmt, crop: donAmt };
          const canDonate = al && canAfford(v.resources, donCost);
          const canRecruitNpc = al && al.members.length < ALLIANCE_NPCS.length && cap.embassyLvl >= al.members.length + 1;

          return `
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
              <div class="lg:col-span-7 bg-stone-50 rounded-2xl border border-stone-300 p-4 shadow-sm space-y-4">
                <div>
                  <h2 class="font-bold text-base text-stone-800">Diplomacia &amp; Aliança</h2>
                  <p class="text-xs text-stone-500">Embaixada Nv.${cap.embassyLvl} • Bônus globais aplicados a todas as suas aldeias.</p>
                </div>

                ${
                  !hasEmbassy && !al
                    ? `<div class="p-4 rounded-xl bg-amber-50 border border-amber-300 text-amber-950 text-xs space-y-1">
                        <div class="font-bold">🏛️ Construa a Embaixada para Fundar uma Aliança</div>
                        <p>Vá na aba <strong>Aldeia</strong> e construa a <strong>Embaixada</strong> (requer Edifício Principal Nv.2).</p>
                      </div>`
                    : !al
                    ? `<div class="p-4 rounded-xl bg-white border border-stone-200 space-y-3 text-xs">
                        <div class="font-bold text-sm text-stone-900">Fundar Nova Aliança</div>
                        <p class="text-stone-600">Escolha o nome e a sigla (Tag de até 4 letras) da sua Aliança para desbloquear bônus permanentes de produção, ataque e comércio.</p>
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                          <input id="allianceNameIn" type="text" maxlength="24" placeholder="Nome da Aliança" value="${ui.allianceNameDraft}" class="sm:col-span-2 px-3 py-2 rounded-lg border border-stone-300 font-semibold" />
                          <input id="allianceTagIn" type="text" maxlength="4" placeholder="TAG (ex: SPQR)" value="${ui.allianceTagDraft}" class="px-3 py-2 rounded-lg border border-stone-300 font-mono font-bold uppercase" />
                        </div>
                        <button id="btnCreateAlliance" class="w-full py-2.5 rounded-xl bg-sky-700 hover:bg-sky-600 text-white font-bold cursor-pointer">🛡️ Fundar Aliança</button>
                      </div>`
                    : `<div class="p-4 rounded-xl bg-gradient-to-br from-sky-900 to-indigo-950 text-white space-y-3">
                        <div class="flex items-center justify-between">
                          <div>
                            <span class="text-xs font-mono text-sky-300">[${al.tag}]</span>
                            <h3 class="text-lg font-black">${al.name}</h3>
                          </div>
                          <span class="px-3 py-1 rounded-full bg-amber-400 text-stone-950 font-black text-xs">Nível ${al.level}</span>
                        </div>
                        <div class="space-y-1 text-xs">
                          <div class="flex justify-between text-sky-200">
                            <span>Experiência da Aliança</span>
                            <span class="font-mono font-bold">${fmtNum(al.xp)} / ${fmtNum(nextXp)} XP</span>
                          </div>
                          <div class="w-full h-2 bg-sky-950 rounded-full overflow-hidden">
                            <div class="h-full bg-amber-400" style="width:${xpPct}%"></div>
                          </div>
                        </div>
                        <div class="grid grid-cols-3 gap-2 text-center text-xs pt-1">
                          <div class="p-2 rounded-lg bg-white/10">
                            <div class="text-sky-200 text-[10px]">Produção</div>
                            <strong class="text-emerald-300">+${alBonus.prodPct}%</strong>
                          </div>
                          <div class="p-2 rounded-lg bg-white/10">
                            <div class="text-sky-200 text-[10px]">Ataque Tropas</div>
                            <strong class="text-amber-300">+${alBonus.atkPct}%</strong>
                          </div>
                          <div class="p-2 rounded-lg bg-white/10">
                            <div class="text-sky-200 text-[10px]">Vel. Mercadores</div>
                            <strong class="text-cyan-300">+${alBonus.merchantPct}%</strong>
                          </div>
                        </div>
                      </div>

                      <div class="p-4 rounded-xl bg-white border border-stone-200 space-y-3 text-xs">
                        <div class="font-bold text-sm text-stone-800">Tesouro da Aliança (Doar Recursos para Evoluir)</div>
                        <div class="flex flex-wrap gap-2">
                          ${[250, 500, 1500, 5000]
                            .map(
                              (amt) => `<button data-donamt="${amt}" class="btn-don-preset px-3 py-1.5 rounded-lg border font-bold cursor-pointer ${donAmt === amt ? 'bg-sky-700 text-white border-sky-600' : 'bg-stone-100 text-stone-700 border-stone-300'}">${fmtNum(amt)} de cada</button>`
                            )
                            .join('')}
                        </div>
                        <button id="btnDonateAlliance" ${canDonate ? '' : 'disabled'} class="w-full py-2.5 rounded-xl font-bold cursor-pointer ${canDonate ? 'bg-emerald-700 hover:bg-emerald-600 text-white' : 'bg-stone-200 text-stone-400 cursor-not-allowed'}">
                          🏛️ Doar ${fmtNum(donAmt)} Mad, Bar, Fer e Cer (+${fmtNum(donAmt * 4)} XP)
                        </button>
                      </div>`
                }
              </div>

              <div class="lg:col-span-5 bg-white rounded-xl border border-stone-300 p-4 shadow-sm space-y-3 text-xs">
                <div class="flex items-center justify-between">
                  <h3 class="font-bold text-sm text-stone-800">Membros &amp; Comandantes Aliados</h3>
                  ${
                    al && al.members.length < ALLIANCE_NPCS.length
                      ? `<button id="btnRecruitMember" ${canRecruitNpc ? '' : 'disabled'} class="px-2.5 py-1.5 rounded-lg font-bold cursor-pointer ${canRecruitNpc ? 'bg-sky-700 text-white' : 'bg-stone-200 text-stone-400 cursor-not-allowed'}">
                          ${canRecruitNpc ? '+ Recrutar Aliado' : `Req. Embaixada Nv.${al.members.length + 1}`}
                        </button>`
                      : ''
                  }
                </div>
                ${
                  !al
                    ? `<p class="text-stone-500">Funde sua Aliança para convidar comandantes aliados e somar pontos de poder.</p>`
                    : `<div class="space-y-2">
                        <div class="p-2.5 rounded-lg bg-amber-50 border border-amber-200 flex justify-between items-center">
                          <div><strong>Você (Fundador)</strong> <span class="text-stone-500">• ${state.villages.length} aldeia(s)</span></div>
                          <span class="font-bold text-amber-800">Líder</span>
                        </div>
                        ${al.members
                          .map(
                            (m) => `<div class="p-2.5 rounded-lg bg-stone-50 border border-stone-200 flex justify-between items-center">
                              <div><strong>${m.name}</strong> <span class="text-stone-500">• ${m.role}</span></div>
                              <span class="font-mono font-bold text-sky-800">Poder ${m.power}</span>
                            </div>`
                          )
                          .join('')}
                      </div>`
                }
              </div>
            </div>
          `;
        }

        // ====================================================================
        // ABA MAPA
        // ====================================================================
        if (ui.tab === 'map') {
          const cx = ui.mapCenter.x;
          const cy = ui.mapCenter.y;
          let gridHtml = '';
          for (let r = 0; r < VIEWPORT_SIZE; r++) {
            const ty = cy + (3 - r);
            for (let c = 0; c < VIEWPORT_SIZE; c++) {
              const tx = cx + (c - 3);
              if (tx < MAP_MIN || tx > MAP_MAX || ty < MAP_MIN || ty > MAP_MAX) {
                gridHtml += `<div class="rounded-lg bg-stone-300/60 border border-stone-300 flex items-center justify-center text-[10px] text-stone-400">—</div>`;
                continue;
              }
              const pv = state.villages.find((vl) => vl.x === tx && vl.y === ty);
              const tile = pv ? { x: tx, y: ty, type: 'player_village' } : generateTile(state.worldSeed, tx, ty);
              const regenPct = tile.type === 'barbarian' ? Math.round(getRegen(state.barbarianStates, tx, ty, now) * 100) : 100;
              let cls = 'bg-emerald-100 hover:bg-emerald-200 border-emerald-300 text-emerald-950';
              let icon = '🌿';
              let sub = 'Vale';
              if (tile.type === 'player_village') {
                cls = 'bg-gradient-to-br from-amber-500 to-amber-700 border-amber-300 text-white ring-2 ring-amber-400';
                icon = '🏰';
                sub = 'Aldeia';
              } else if (tile.type === 'barbarian') {
                cls = 'bg-gradient-to-br from-red-700 to-red-950 border-red-500 text-red-50';
                icon = '⚔️';
                sub = `Nv.${tile.barbarian.level} (${regenPct}%)`;
              } else if (tile.type === 'oasis') {
                cls = 'bg-gradient-to-br from-teal-600 to-cyan-900 border-teal-400 text-teal-50';
                icon = '✨';
                sub = `+${tile.oasis.percent}%`;
              } else if (tile.valley && tile.valley.rare) {
                cls = 'bg-gradient-to-br from-lime-200 to-amber-200 border-amber-500 text-stone-900';
                icon = '🌾';
                sub = tile.valley.label;
              }

              gridHtml += `
                <button data-tile="${tx},${ty}" class="map-tile rounded-lg border p-1 flex flex-col items-center justify-between text-center transition-transform hover:scale-105 cursor-pointer ${cls}">
                  <span class="text-[8px] font-mono opacity-80 leading-none">${tx}|${ty}</span>
                  <span class="text-sm sm:text-base leading-none">${icon}</span>
                  <span class="text-[7px] sm:text-[8px] font-extrabold leading-none truncate w-full">${sub}</span>
                </button>
              `;
            }
          }

          const radarLeft = ((cx - MAP_MIN) / (MAP_MAX - MAP_MIN)) * 100;
          const radarTop = ((MAP_MAX - cy) / (MAP_MAX - MAP_MIN)) * 100;

          return `
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
              <div class="lg:col-span-7 bg-stone-50 rounded-2xl border border-stone-300 p-4 shadow-sm space-y-3">
                <div class="flex flex-wrap items-center justify-between gap-2">
                  <div>
                    <h2 class="font-bold text-stone-800 text-base">Mapa 151×151 (${cx} | ${cy})</h2>
                    <p class="text-xs text-stone-500">Sua aldeia em (${v.x}|${v.y}) • Janela local 7×7</p>
                  </div>
                  <div class="flex items-center gap-1">
                    <button id="mapHome" class="px-2.5 py-1.5 rounded-lg bg-amber-100 hover:bg-amber-200 border border-amber-300 text-amber-900 text-xs font-bold cursor-pointer">📍 Minha Aldeia</button>
                  </div>
                </div>

                <div class="flex flex-col items-center gap-2">
                  <button data-move="0,1" class="map-move w-full max-w-md py-1.5 rounded-lg bg-stone-200 hover:bg-stone-300 text-xs font-bold cursor-pointer">▲ Norte (+Y)</button>
                  <div class="flex items-center gap-1.5 w-full justify-center">
                    <button data-move="-1,0" class="map-move p-2 rounded-lg bg-stone-200 hover:bg-stone-300 text-xs font-bold cursor-pointer">◀</button>
                    <div class="grid grid-cols-7 gap-1 sm:gap-1.5 w-full max-w-md aspect-square bg-emerald-950/15 p-1.5 rounded-xl border border-stone-300">
                      ${gridHtml}
                    </div>
                    <button data-move="1,0" class="map-move p-2 rounded-lg bg-stone-200 hover:bg-stone-300 text-xs font-bold cursor-pointer">▶</button>
                  </div>
                  <button data-move="0,-1" class="map-move w-full max-w-md py-1.5 rounded-lg bg-stone-200 hover:bg-stone-300 text-xs font-bold cursor-pointer">▼ Sul (-Y)</button>
                </div>
              </div>

              <div class="lg:col-span-5 space-y-4">
                <div class="bg-white rounded-xl border border-stone-300 p-4 shadow-sm space-y-2.5">
                  <div class="flex items-center justify-between">
                    <h3 class="font-bold text-sm text-stone-800">Radar Global (151×151)</h3>
                    <span class="text-[11px] font-mono text-stone-500">22.801 quadrantes</span>
                  </div>
                  <div id="radarBox" class="relative w-full h-36 rounded-xl bg-stone-900 border border-stone-700 overflow-hidden cursor-crosshair">
                    <div class="absolute inset-y-0 left-1/2 w-px bg-stone-700 pointer-events-none"></div>
                    <div class="absolute inset-x-0 top-1/2 h-px bg-stone-700 pointer-events-none"></div>
                    ${state.villages
                      .map((vl) => {
                        const l = ((vl.x - MAP_MIN) / (MAP_MAX - MAP_MIN)) * 100;
                        const t = ((MAP_MAX - vl.y) / (MAP_MAX - MAP_MIN)) * 100;
                        return `<div style="left:${l}%;top:${t}%" class="absolute -translate-x-1/2 -translate-y-1/2 w-2.5 h-2.5 rounded-full bg-amber-400 ring-2 ring-amber-200 pointer-events-none"></div>`;
                      })
                      .join('')}
                    <div style="left:${radarLeft}%;top:${radarTop}%" class="absolute -translate-x-1/2 -translate-y-1/2 w-4 h-4 border-2 border-emerald-400 bg-emerald-400/20 pointer-events-none"></div>
                  </div>
                  <p class="text-[11px] text-stone-500">Clique em qualquer ponto do radar para navegar pelo mapa de 151×151.</p>
                </div>

                <div class="bg-white rounded-xl border border-stone-300 p-4 shadow-sm space-y-2 text-xs">
                  <h3 class="font-bold text-sm text-stone-800">Legenda</h3>
                  <div class="grid grid-cols-2 gap-2">
                    <div class="p-2 rounded-lg bg-amber-50 border border-amber-200">🏰 Suas Aldeias (${state.villages.length})</div>
                    <div class="p-2 rounded-lg bg-red-50 border border-red-200">⚔️ Bárbaros (IA)</div>
                    <div class="p-2 rounded-lg bg-teal-50 border border-teal-200">✨ Oásis (+25%/+50%)</div>
                    <div class="p-2 rounded-lg bg-lime-50 border border-lime-300">🌾 Vales / 9-15 Cereais</div>
                  </div>
                </div>
              </div>
            </div>
          `;
        }

        // ====================================================================
        // ABA QUARTEL & TROPAS (COM ÍCONES, TEMPORIZADOR E RECRUTAMENTO EM LOTE)
        // ====================================================================
        if (ui.tab === 'barracks') {
          const resLvl = cap.resLvl;
          const barLvl = cap.barracksLvl;
          const barSpeedMult = Math.max(0.4, 1 - Math.max(0, barLvl - 1) * 0.03);

          return `
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
              <div class="lg:col-span-7 bg-stone-50 rounded-2xl border border-stone-300 p-4 shadow-sm space-y-3.5">
                <div class="flex flex-wrap items-center justify-between gap-2">
                  <div>
                    <h2 class="font-bold text-base text-stone-800">Quartel &amp; Colonização</h2>
                    <p class="text-xs text-stone-500">Quartel Nv.${barLvl} • Residência Nv.${resLvl} • Bônus Ataque Aliança: <strong class="text-sky-700">+${alBonus.atkPct}%</strong> • Consumo: <strong class="text-red-700">-${prod.upkeep}/h</strong></p>
                  </div>
                </div>

                <!-- Guarnição atual com ícones -->
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
                  ${UNIT_ORDER.map((u) => {
                    const uc = UNIT_CONFIG[u];
                    return `
                      <div class="p-2.5 rounded-xl bg-white border border-stone-200 flex items-center gap-2.5">
                        <div class="w-9 h-9 rounded-lg border flex items-center justify-center text-lg shrink-0 ${uc.badgeBg}">
                          ${uc.icon}
                        </div>
                        <div class="min-w-0">
                          <div class="text-[11px] text-stone-500 truncate">${uc.name}</div>
                          <div class="text-base font-black text-stone-900 leading-tight">${fmtNum(v.troops[u] || 0)}</div>
                        </div>
                      </div>
                    `;
                  }).join('')}
                </div>

                <!-- Lista de recrutamento com ícones e seletor de quantidade -->
                <div class="space-y-3">
                  ${UNIT_ORDER.map((u) => {
                    const c = UNIT_CONFIG[u];
                    const unlocked =
                      c.reqBuilding === 'residence' ? resLvl >= c.reqLvl : barLvl >= c.reqLvl;
                    const maxAfford = unlocked ? getMaxAffordableUnits(v.resources, c.cost) : 0;
                    const qty = Math.max(1, Math.min(999, Math.floor(Number(ui.trainQty[u]) || 1)));
                    const totalCost = multiplyCost(c.cost, qty);
                    const unitSec = Math.max(1, Math.round(c.trainSec * barSpeedMult));
                    const totalSec = unitSec * qty;
                    const ok = unlocked && canAfford(v.resources, totalCost);
                    const reqText =
                      c.reqBuilding === 'residence'
                        ? `Req. Residência Nv.${c.reqLvl}`
                        : `Req. Quartel Nv.${c.reqLvl}`;

                    return `
                      <div class="p-3.5 rounded-xl bg-white border border-stone-200 space-y-2.5 shadow-xs">
                        <div class="flex items-start justify-between gap-3">
                          <div class="flex items-start gap-3 min-w-0">
                            <div class="w-12 h-12 rounded-xl border-2 flex items-center justify-center text-2xl shrink-0 shadow-xs ${c.badgeBg}">
                              ${c.icon}
                            </div>
                            <div class="min-w-0">
                              <div class="font-bold text-sm text-stone-900 flex flex-wrap items-center gap-1.5">
                                <span>${c.name}</span>
                                <span class="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-stone-100 text-stone-600">${c.role}</span>
                              </div>
                              <div class="text-[11px] text-stone-500 mt-0.5">
                                Atq: <strong>${c.atk}</strong> • Def: <strong>${c.def}</strong> • Vel: <strong>${c.speed}</strong> c/h • Carga: <strong>${c.carry}</strong> • ${fmtTime(unitSec)}/unid.
                              </div>
                              <div class="text-[11px] font-semibold text-stone-700 mt-1">
                                Custo (${qty}x): <span class="text-emerald-800">${fmtNum(totalCost.wood)} Mad</span> • <span class="text-orange-800">${fmtNum(totalCost.clay)} Bar</span> • <span class="text-slate-800">${fmtNum(totalCost.iron)} Fer</span> • <span class="text-amber-800">${fmtNum(totalCost.crop)} Cer</span>
                              </div>
                            </div>
                          </div>
                        </div>

                        ${
                          unlocked
                            ? `<div class="pt-2 border-t border-stone-100 flex flex-wrap items-center justify-between gap-2">
                                <div class="flex items-center gap-1.5">
                                  <span class="text-[11px] font-bold text-stone-500">Qtd:</span>
                                  <input data-qtyinput="${u}" type="number" min="1" max="999" value="${qty}" class="unit-qty-input w-16 px-2 py-1 rounded-lg border border-stone-300 font-mono font-bold text-xs text-center bg-stone-50" />
                                  <button data-setqty="${u}:1" class="btn-set-qty px-2 py-1 rounded-md bg-stone-100 hover:bg-stone-200 border border-stone-300 text-[11px] font-bold cursor-pointer">1</button>
                                  <button data-setqty="${u}:5" class="btn-set-qty px-2 py-1 rounded-md bg-stone-100 hover:bg-stone-200 border border-stone-300 text-[11px] font-bold cursor-pointer">+5</button>
                                  <button data-setqty="${u}:10" class="btn-set-qty px-2 py-1 rounded-md bg-stone-100 hover:bg-stone-200 border border-stone-300 text-[11px] font-bold cursor-pointer">+10</button>
                                  <button data-setqty="${u}:max" ${maxAfford > 0 ? '' : 'disabled'} class="btn-set-qty px-2 py-1 rounded-md border text-[11px] font-bold cursor-pointer ${maxAfford > 0 ? 'bg-amber-50 hover:bg-amber-100 border-amber-300 text-amber-900' : 'bg-stone-100 border-stone-200 text-stone-400 cursor-not-allowed'}">
                                    Máx (${maxAfford})
                                  </button>
                                </div>

                                <button data-train="${u}" ${ok ? '' : 'disabled'} class="btn-train px-4 py-2 rounded-lg text-xs font-bold cursor-pointer flex items-center gap-1.5 ${ok ? 'bg-amber-600 hover:bg-amber-500 text-white shadow-xs' : 'bg-stone-200 text-stone-400 cursor-not-allowed'}">
                                  <span>${c.icon}</span>
                                  <span>Treinar ${qty}x (${fmtTime(totalSec)})</span>
                                </button>
                              </div>`
                            : `<div class="pt-1.5 border-t border-stone-100 flex justify-end">
                                <span class="px-3 py-1.5 rounded-lg bg-stone-200 text-stone-500 text-xs font-bold">${reqText}</span>
                              </div>`
                        }
                      </div>
                    `;
                  }).join('')}
                </div>
              </div>

              <!-- Coluna lateral: Fila de Treinamento com Temporizadores + Marchas -->
              <div class="lg:col-span-5 space-y-4">
                <div class="bg-white rounded-xl border border-stone-300 p-4 shadow-sm space-y-3">
                  <div class="flex items-center justify-between">
                    <h3 class="font-bold text-sm text-stone-800">Fila de Treinamento (${v.training.length})</h3>
                    <span class="text-[11px] text-stone-500">Tempo real</span>
                  </div>

                  ${
                    v.training.length === 0
                      ? `<p class="text-xs text-stone-500">Nenhum recruta em treinamento no momento. Selecione a quantidade ao lado para iniciar.</p>`
                      : v.training
                          .map((item) => {
                            const uc = UNIT_CONFIG[item.unitType];
                            const perMs = Math.max(250, item.perUnitMs);
                            const totalUnits = item.count;
                            const doneUnits = Math.min(totalUnits, item.completedCount);
                            const remainingUnits = Math.max(0, totalUnits - doneUnits);
                            const nextBirthAt = item.startedAt + (doneUnits + 1) * perMs;
                            const finishAllAt = item.startedAt + totalUnits * perMs;
                            const nextRemSec = Math.max(0, Math.ceil((nextBirthAt - now) / 1000));
                            const allRemSec = Math.max(0, Math.ceil((finishAllAt - now) / 1000));
                            const unitElapsedMs = Math.max(0, Math.min(perMs, now - (item.startedAt + doneUnits * perMs)));
                            const unitPct = Math.min(100, Math.round((unitElapsedMs / perMs) * 100));

                            return `
                              <div class="p-3 rounded-xl bg-amber-50/70 border border-amber-200 space-y-2 text-xs">
                                <div class="flex items-center justify-between gap-2">
                                  <div class="flex items-center gap-2 min-w-0">
                                    <span class="w-8 h-8 rounded-lg border flex items-center justify-center text-base shrink-0 ${uc.badgeBg}">${uc.icon}</span>
                                    <div class="min-w-0">
                                      <div class="font-bold text-stone-900 truncate">${remainingUnits}x ${uc.name}</div>
                                      <div class="text-[11px] text-stone-500">Concluídos: ${doneUnits}/${totalUnits}</div>
                                    </div>
                                  </div>
                                  <div class="text-right shrink-0">
                                    <div class="text-[10px] uppercase font-bold text-amber-800">Próximo nasce em</div>
                                    <div class="font-mono font-black text-sm text-stone-900">${fmtTime(nextRemSec)}</div>
                                  </div>
                                </div>

                                <div class="w-full h-2 bg-stone-200 rounded-full overflow-hidden">
                                  <div class="h-full bg-amber-500 transition-all duration-300" style="width:${unitPct}%"></div>
                                </div>

                                <div class="flex items-center justify-between text-[11px] text-stone-600">
                                  <span>Progresso do recruta atual: <strong>${unitPct}%</strong></span>
                                  <span>Lote total: <strong class="font-mono">${fmtTime(allRemSec)}</strong></span>
                                </div>
                              </div>
                            `;
                          })
                          .join('')
                  }
                </div>

                <div class="bg-white rounded-xl border border-stone-300 p-4 shadow-sm space-y-2.5">
                  <h3 class="font-bold text-sm text-stone-800">Movimentos de Tropas (${state.marches.length})</h3>
                  ${
                    state.marches.length === 0
                      ? `<p class="text-xs text-stone-500">Nenhuma marcha ativa. Vá ao Mapa para atacar ou fundar aldeias.</p>`
                      : state.marches
                          .map((m) => `<div class="p-2.5 rounded-lg bg-stone-50 border border-stone-200 text-xs flex justify-between"><div><strong>${m.targetName}</strong> <span class="text-stone-500">(${m.status === 'returning' ? 'Retornando' : 'Indo'})</span></div><span class="font-mono font-bold">${fmtTime(Math.max(0, Math.ceil((m.arrivesAt - now) / 1000)))}</span></div>`)
                          .join('')
                  }
                </div>
              </div>
            </div>
          `;
        }

        // ====================================================================
        // ABA RELATÓRIOS
        // ====================================================================
        if (ui.tab === 'reports') {
          return `
            <div class="bg-white rounded-2xl border border-stone-300 p-4 shadow-sm space-y-3">
              <h2 class="font-bold text-base text-stone-800">Relatórios de Batalha, Comércio e Colonização</h2>
              ${
                state.reports.length === 0
                  ? `<p class="text-xs text-stone-500">Nenhum relatório ainda.</p>`
                  : state.reports
                      .map(
                        (r) => `<div class="p-3 rounded-xl border ${r.outcome === 'victory' ? 'bg-emerald-50/70 border-emerald-200' : 'bg-red-50/70 border-red-200'} space-y-1">
                          <div class="flex items-center justify-between text-xs"><strong>${r.title}</strong><span class="font-bold uppercase">${r.outcome === 'victory' ? 'Concluído' : 'Derrota'}</span></div>
                          <p class="text-xs text-stone-700">${r.info}</p>
                        </div>`
                      )
                      .join('')
              }
            </div>
          `;
        }

        // ====================================================================
        // ABA CENTRO DA ALDEIA (24 TERRENOS)
        // ====================================================================
        if (ui.tab === 'center') {
          const slot = v.slots.find((s) => s.id === ui.selectedSlotId) || v.slots[0];
          const isOccupied = slot.buildingType !== null;
          return `
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
              <div class="lg:col-span-7 bg-stone-50 rounded-2xl border border-stone-300 p-4 shadow-sm">
                <h2 class="font-bold text-base text-stone-800 mb-3">Centro da Aldeia (24 Terrenos)</h2>
                <div class="grid grid-cols-4 sm:grid-cols-6 gap-2">
                  ${v.slots
                    .map((s) => {
                      const sel = s.id === slot.id;
                      if (!s.buildingType) {
                        return `<button data-slot="${s.id}" class="slot-btn aspect-square rounded-xl border-2 border-dashed p-1.5 flex flex-col items-center justify-center text-center cursor-pointer ${sel ? 'bg-amber-50 border-amber-500 text-amber-900' : 'bg-stone-100 border-stone-300 text-stone-500'}"><span class="text-base leading-none">+</span><span class="text-[10px] font-bold">Vazio #${s.id}</span></button>`;
                      }
                      const c = BUILDING_CONFIG[s.buildingType];
                      return `<button data-slot="${s.id}" class="slot-btn aspect-square rounded-xl bg-gradient-to-br ${c.grad} border-2 p-1.5 text-white flex flex-col items-center justify-between text-center cursor-pointer ${sel ? 'ring-4 ring-amber-400' : ''}"><span class="text-[9px] font-bold self-end bg-black/30 px-1 rounded">Nv.${s.level}</span><span class="text-[11px] font-bold leading-tight">${c.name}</span><span class="text-[8px] opacity-75">#${s.id}</span></button>`;
                    })
                    .join('')}
                </div>
              </div>
              <div class="lg:col-span-5 bg-white rounded-2xl border border-stone-300 p-4 shadow-sm space-y-3">
                ${
                  isOccupied
                    ? (() => {
                        const c = BUILDING_CONFIG[slot.buildingType];
                        const nextLvl = Math.min(MAX_BUILDING_LEVEL, slot.level + 1);
                        const cost = bldCost(slot.buildingType, nextLvl);
                        const sec = bldSec(slot.buildingType, nextLvl, cap.speedMult);
                        const ok = slot.level < MAX_BUILDING_LEVEL && canAfford(v.resources, cost) && v.queue.length < MAX_QUEUE_SIZE;
                        return `
                          <h3 class="font-bold text-lg text-stone-900">${c.name} (Nv.${slot.level})</h3>
                          <p class="text-xs text-stone-600">${c.desc}</p>
                          <div class="text-xs bg-stone-50 p-3 rounded-xl border border-stone-200 space-y-1">
                            <div>Custo Nv.${nextLvl}: <strong>${cost.wood} Mad • ${cost.clay} Bar • ${cost.iron} Fer • ${cost.crop} Cer</strong></div>
                            <div>Tempo: <strong>${fmtTime(sec)}</strong></div>
                          </div>
                          <button id="btnUpgradeBld" ${ok ? '' : 'disabled'} class="w-full py-2.5 rounded-xl font-bold text-xs cursor-pointer ${ok ? 'bg-amber-600 hover:bg-amber-500 text-white' : 'bg-stone-200 text-stone-400 cursor-not-allowed'}">Evoluir para Nível ${nextLvl}</button>
                        `;
                      })()
                    : `<h3 class="font-bold text-base text-stone-900 mb-2">Construir no Terreno #${slot.id}</h3>
                       <div id="buildingCatalogList" class="space-y-2 max-h-[60vh] overflow-y-auto">
                         ${BUILDING_ORDER.map((bt) => {
                           const c = BUILDING_CONFIG[bt];
                           const av = checkReqs(bt, v);
                           const cost = bldCost(bt, 1);
                           const ok = av.canBuild && canAfford(v.resources, cost) && v.queue.length < MAX_QUEUE_SIZE;
                           return `<div class="p-3 rounded-xl border border-stone-200 bg-stone-50 space-y-1.5">
                             <div class="flex justify-between items-center"><strong class="text-xs text-stone-900">${c.name}</strong><span class="text-[11px] text-amber-800 font-semibold">${c.tagline}</span></div>
                             <div class="text-[11px] text-stone-600">${cost.wood} Mad • ${cost.clay} Bar • ${cost.iron} Fer • ${cost.crop} Cer</div>
                             ${av.reqStatus.map((rq) => `<div class="text-[11px] font-semibold ${rq.ok ? 'text-emerald-700' : 'text-red-700'}">${rq.ok ? '✓' : '✗'} ${rq.label}</div>`).join('')}
                             <button data-build="${bt}" ${ok ? '' : 'disabled'} class="btn-build w-full py-1.5 rounded-lg text-xs font-bold cursor-pointer ${ok ? 'bg-amber-600 hover:bg-amber-500 text-white' : 'bg-stone-200 text-stone-400 cursor-not-allowed'}">${av.canBuild ? 'Construir' : av.reason}</button>
                           </div>`;
                         }).join('')}
                       </div>`
                }
              </div>
            </div>
          `;
        }

        // ====================================================================
        // ABA CAMPOS DE RECURSOS (PADRÃO)
        // ====================================================================
        const f = v.fields.find((x) => x.id === ui.selectedFieldId) || v.fields[0];
        const fCfg = FIELD_CONFIG[f.type];
        const nextLvl = Math.min(MAX_FIELD_LEVEL, f.level + 1);
        const cost = fieldCost(f.type, nextLvl);
        const sec = fieldSec(f.type, nextLvl, cap.speedMult);
        const canUp = f.level < MAX_FIELD_LEVEL && canAfford(v.resources, cost) && v.queue.length < MAX_QUEUE_SIZE;

        return `
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
            <div class="lg:col-span-7 space-y-4">
              <div class="bg-stone-50 rounded-2xl border border-stone-300 p-4 shadow-sm">
                <div class="flex items-center justify-between mb-2">
                  <h2 class="font-bold text-base text-stone-800">Campos de Recursos (${v.name})</h2>
                  <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-amber-100 text-amber-900">Máx Nv.10</span>
                </div>
                <div class="relative w-full max-w-md mx-auto aspect-square rounded-full bg-gradient-to-b from-lime-800/20 via-emerald-800/15 to-amber-900/20 border-4 border-stone-300 my-2">
                  <button id="goCenterCircle" class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-20 h-20 rounded-full bg-stone-800 hover:bg-stone-700 border-4 border-amber-500 text-amber-100 flex flex-col items-center justify-center text-[10px] font-bold shadow-lg cursor-pointer">
                    <span>🏛️</span>
                    <span>Centro</span>
                  </button>
                  ${FIELD_POSITIONS.map((pos) => {
                    const fld = v.fields.find((x) => x.id === pos.id);
                    const fc = FIELD_CONFIG[fld.type];
                    const sel = fld.id === f.id;
                    return `<button data-field="${fld.id}" style="left:${pos.x}%;top:${pos.y}%" class="field-btn -translate-x-1/2 -translate-y-1/2 absolute w-11 h-11 rounded-full bg-gradient-to-br ${fc.tile} border-2 text-white font-extrabold text-xs shadow flex items-center justify-center cursor-pointer ${sel ? 'ring-4 ring-amber-400 scale-110 z-20' : 'z-10'}">${fld.level}</button>`;
                  }).join('')}
                </div>
              </div>

              <div class="bg-white rounded-xl border border-stone-300 p-4 shadow-sm space-y-2">
                <h3 class="font-bold text-sm text-stone-800">Fila de Construção (${v.queue.length}/${MAX_QUEUE_SIZE})</h3>
                ${
                  v.queue.length === 0
                    ? `<p class="text-xs text-stone-500">Nenhuma obra em andamento.</p>`
                    : v.queue
                        .map((q) => {
                          const rem = Math.max(0, Math.ceil((q.endsAt - now) / 1000));
                          const tot = Math.max(1, (q.endsAt - q.startedAt) / 1000);
                          const pct = Math.min(100, Math.max(0, ((tot - rem) / tot) * 100));
                          const lbl = q.kind === 'field' ? `${FIELD_CONFIG[v.fields.find((x) => x.id === q.targetId).type].fieldName} #${q.targetId}` : BUILDING_CONFIG[q.bType].name;
                          return `<div class="p-2.5 rounded-lg bg-stone-50 border border-stone-200 space-y-1.5"><div class="flex justify-between text-xs"><strong>${lbl} → Nv.${q.targetLevel}</strong><span class="font-mono font-bold">${fmtTime(rem)}</span></div><div class="w-full h-2 bg-stone-200 rounded-full overflow-hidden"><div class="h-full bg-amber-500" style="width:${pct}%"></div></div></div>`;
                        })
                        .join('')
                }
              </div>
            </div>

            <div class="lg:col-span-5 bg-white rounded-2xl border border-stone-300 overflow-hidden shadow-sm">
              <div class="p-4 bg-gradient-to-r ${fCfg.tile} text-white flex items-center justify-between">
                <div><span class="text-xs uppercase opacity-80">Campo #${f.id}</span><h3 class="text-lg font-bold">${fCfg.fieldName}</h3></div>
                <div class="text-2xl font-black">Nv.${f.level}</div>
              </div>
              <div class="p-4 space-y-3">
                <div class="grid grid-cols-2 gap-2 text-xs bg-stone-50 p-3 rounded-xl border border-stone-200">
                  <div><span class="text-stone-500 block">Produção Atual</span><strong>${FIELD_PROD_TABLE[f.level]}/h</strong></div>
                  <div><span class="text-stone-500 block">Próximo Nível</span><strong class="text-emerald-700">${FIELD_PROD_TABLE[nextLvl]}/h</strong></div>
                </div>
                <div class="text-xs space-y-1">
                  <div>Custo Nv.${nextLvl}: <strong>${cost.wood} Mad • ${cost.clay} Bar • ${cost.iron} Fer • ${cost.crop} Cer</strong></div>
                  <div>Tempo de construção: <strong>${fmtTime(sec)}</strong></div>
                </div>
                <button id="btnUpgradeField" ${canUp ? '' : 'disabled'} class="w-full py-3 rounded-xl font-bold text-sm cursor-pointer ${canUp ? 'bg-amber-600 hover:bg-amber-500 text-white' : 'bg-stone-200 text-stone-400 cursor-not-allowed'}">
                  ${f.level >= MAX_FIELD_LEVEL ? 'Nível Máximo' : `Evoluir para Nível ${nextLvl}`}
                </button>
              </div>
            </div>
          </div>
        `;
      }

      function renderTileModal(v, now) {
        const t = ui.inspectedTile;
        const dist = Math.hypot(t.x - v.x, t.y - v.y).toFixed(1);
        const isPeace = now < (state.peaceEndsAt || 0);
        const resLvl = v.slots.filter((s) => s.buildingType === 'residence').reduce((m, s) => Math.max(m, s.level), 0);
        const hasRes = resLvl >= 5;
        const hasSettlers = v.troops.settler >= 3;
        const canSettle = t.type === 'valley' && hasSettlers;
        const combatCount =
          v.troops.legionnaire +
          v.troops.spearman +
          v.troops.praetorian +
          v.troops.equites +
          v.troops.scout +
          v.troops.catapult;
        const canAttack = !isPeace && (t.type === 'barbarian' || t.type === 'oasis') && combatCount > 0;

        return `
          <div id="tileModalBg" class="fixed inset-0 z-50 bg-stone-950/70 flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl max-w-md w-full border border-stone-300 shadow-2xl overflow-hidden">
              <div class="px-5 py-3.5 bg-stone-900 text-white flex items-center justify-between">
                <div><span class="font-mono text-xs text-amber-300">(${t.x} | ${t.y}) • ${dist} campos</span><h3 class="font-bold text-base">${t.type === 'player_village' ? v.name : t.type === 'barbarian' ? t.barbarian.name : t.type === 'oasis' ? `Oásis (${t.oasis.label})` : `Vale Abandonado (${t.valley.label})`}</h3></div>
                <button id="closeTileModal" class="text-stone-400 hover:text-white text-lg font-bold cursor-pointer">✕</button>
              </div>
              <div class="p-5 space-y-3 text-xs">
                ${t.type === 'barbarian' ? `<p class="text-stone-700">Recuperação atual: <strong>${Math.round(getRegen(state.barbarianStates, t.x, t.y, now) * 100)}%</strong> • Saque estimado: ~${t.barbarian.loot.wood} Mad, ~${t.barbarian.loot.clay} Bar, ~${t.barbarian.loot.iron} Fer, ~${t.barbarian.loot.crop} Cer.</p>` : ''}
                ${t.type === 'oasis' ? `<p class="text-teal-900 font-semibold">Conquistar este oásis adiciona ${t.oasis.label} à aldeia ativa.</p>` : ''}
                ${
                  t.type === 'valley'
                    ? `<div class="space-y-2.5">
                        <div class="p-2.5 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-900">
                          <strong>Terreno Neutro:</strong> Vales abandonados não são bloqueados pelo período de paz e podem ser colonizados para formar uma nova aldeia com estes 18 campos:
                        </div>
                        <div class="grid grid-cols-4 gap-1.5 text-center font-bold">
                          <div class="p-2 rounded-lg bg-emerald-100 text-emerald-900">🌲 ${t.valley.wood} Mad</div>
                          <div class="p-2 rounded-lg bg-orange-100 text-orange-900">🧱 ${t.valley.clay} Bar</div>
                          <div class="p-2 rounded-lg bg-slate-200 text-slate-900">⛏️ ${t.valley.iron} Fer</div>
                          <div class="p-2 rounded-lg bg-amber-100 text-amber-900">🌾 ${t.valley.crop} Cer</div>
                        </div>
                        <div class="p-3 rounded-xl bg-stone-50 border border-stone-200 space-y-1">
                          <div class="font-bold text-stone-800">Requisitos para Fundar Nova Aldeia:</div>
                          <div class="${hasRes ? 'text-emerald-700 font-semibold' : 'text-red-700 font-semibold'}">${hasRes ? '✓' : '✗'} Residência Nv. 5+ (Atual: Nv.${resLvl})</div>
                          <div class="${hasSettlers ? 'text-emerald-700 font-semibold' : 'text-red-700 font-semibold'}">${hasSettlers ? '✓' : '✗'} 3 Colonizadores treinados no Quartel (Atual: ${v.troops.settler}/3)</div>
                        </div>
                        <button id="btnSettleHere" ${canSettle ? '' : 'disabled'} class="w-full py-2.5 rounded-xl font-bold cursor-pointer ${canSettle ? 'bg-purple-700 hover:bg-purple-600 text-white' : 'bg-stone-200 text-stone-400 cursor-not-allowed'}">
                          ${canSettle ? '🚩 Enviar 3 Colonizadores e Fundar Aldeia' : 'Treine 3 Colonizadores para Fundar'}
                        </button>
                      </div>`
                    : ''
                }
                ${
                  isPeace && (t.type === 'barbarian' || t.type === 'oasis')
                    ? `<div class="p-2.5 rounded-xl bg-sky-50 border border-sky-300 text-sky-900 font-semibold">🕊️ Período de paz de 21 dias ativo: ataques e conquistas estão bloqueados.</div>`
                    : ''
                }
                ${
                  canAttack
                    ? `<button id="btnAttackHere" class="w-full py-2.5 rounded-xl bg-red-700 hover:bg-red-600 text-white font-bold cursor-pointer">⚔️ Enviar Tropas (${t.type === 'oasis' ? 'Conquistar Oásis' : 'Saquear'})</button>`
                    : ''
                }
              </div>
            </div>
          </div>
        `;
      }

      function renderSaveModal() {
        const lastSyncStr = cloud.lastSyncedAt ? new Date(cloud.lastSyncedAt).toLocaleTimeString('pt-BR') : 'Ainda não sincronizado';
        return `
          <div id="saveModalBg" class="fixed inset-0 z-50 bg-stone-950/70 flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl max-w-md w-full border border-stone-300 shadow-2xl overflow-hidden max-h-[90vh] overflow-y-auto">
              <div class="px-5 py-3.5 bg-stone-900 text-white flex items-center justify-between">
                <h3 class="font-bold text-base">Conta na Nuvem (Supabase) &amp; Save</h3>
                <button id="closeSaveModal" class="text-stone-400 hover:text-white text-lg font-bold cursor-pointer">✕</button>
              </div>
              <div class="p-5 space-y-3.5 text-xs">
                <div class="p-3.5 rounded-xl border ${cloud.user ? 'bg-emerald-50 border-emerald-200' : 'bg-stone-50 border-stone-200'} space-y-2.5">
                  ${
                    !isSupabaseConfigured
                      ? `<div class="font-bold text-amber-900">⚠️ Falta apenas colar a Publishable Key</div>
                         <p class="text-stone-600">Abra o <code>index.html</code> e cole sua chave <code>sb_publishable_...</code> na linha 26.</p>`
                      : cloud.user
                      ? `<div class="flex items-center justify-between">
                           <div>
                             <div class="font-bold text-emerald-900">☁️ Conta Conectada</div>
                             <div class="text-emerald-700 font-semibold">${cloud.user.email}</div>
                             <div class="text-[11px] text-stone-500">Último sync: ${lastSyncStr}</div>
                           </div>
                           <button id="btnLogoutAccount" class="px-2.5 py-1.5 rounded-lg bg-red-100 hover:bg-red-200 text-red-800 font-bold cursor-pointer">Sair</button>
                         </div>
                         <div class="grid grid-cols-2 gap-2">
                           <button id="btnForceSync" class="py-2 rounded-lg bg-emerald-700 hover:bg-emerald-600 text-white font-bold cursor-pointer">⬆️ Enviar p/ Nuvem</button>
                           <button id="btnPullSync" class="py-2 rounded-lg bg-sky-700 hover:bg-sky-600 text-white font-bold cursor-pointer">⬇️ Baixar da Nuvem</button>
                         </div>`
                      : `<div class="font-bold text-stone-900 text-sm">Salvar progresso na nuvem (Grátis)</div>
                         <p class="text-stone-600">Entre com a mesma conta no PC e no celular para sincronizar sua aldeia automaticamente.</p>
                         <input id="authEmailInput" type="email" autocomplete="email" placeholder="Seu e-mail" value="${ui.authEmail}" class="w-full px-3 py-2 rounded-lg border border-stone-300 text-xs" />
                         <input id="authPassInput" type="password" autocomplete="current-password" placeholder="Sua senha (mín. 6 caracteres)" value="${ui.authPassword}" class="w-full px-3 py-2 rounded-lg border border-stone-300 text-xs" />
                         <div class="grid grid-cols-2 gap-2 pt-1">
                           <button id="btnEmailLogin" ${ui.authLoading ? 'disabled' : ''} class="py-2 rounded-lg bg-emerald-700 hover:bg-emerald-600 text-white font-bold cursor-pointer">${ui.authLoading ? 'Aguarde...' : 'Entrar'}</button>
                           <button id="btnEmailSignUp" ${ui.authLoading ? 'disabled' : ''} class="py-2 rounded-lg bg-stone-800 hover:bg-stone-700 text-white font-bold cursor-pointer">Criar Conta</button>
                         </div>`
                  }
                  ${
                    cloud.lastError
                      ? `<div class="p-2 rounded-lg bg-red-100 border border-red-300 text-red-900 text-[11px] font-mono break-all">Detalhe: ${cloud.lastError}</div>`
                      : ''
                  }
                </div>

                <div class="space-y-1.5">
                  <label class="font-bold text-stone-600 block">Backup Manual (Base64)</label>
                  <textarea id="saveArea" rows="3" class="w-full rounded-lg border border-stone-300 p-2 font-mono text-[11px]">${ui.saveText}</textarea>
                  <div class="grid grid-cols-2 gap-2">
                    <button id="btnCopySave" class="py-2 rounded-lg bg-stone-800 text-white font-bold cursor-pointer">Copiar Base64</button>
                    <button id="btnImportSave" class="py-2 rounded-lg bg-amber-600 text-white font-bold cursor-pointer">Importar Save</button>
                  </div>
                </div>

                <div class="pt-2 border-t border-stone-200 space-y-2">
                  <label class="font-bold text-stone-600 block">Nova Seed (Mapa 151×151)</label>
                  <div class="flex gap-2">
                    <input id="seedInput" value="${state.worldSeed}" class="flex-1 px-2.5 py-1.5 rounded-lg border border-stone-300 font-mono font-bold uppercase" />
                    <button id="btnNewSeed" class="px-3 py-1.5 rounded-lg bg-emerald-700 text-white font-bold cursor-pointer">Gerar</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      function bindEvents(v, cap, now) {
        document.querySelectorAll('.nav-btn').forEach((btn) => {
          btn.onclick = () => {
            ui.tab = btn.dataset.tab;
            render();
          };
        });

        const btnCloudLogin = document.getElementById('btnCloudLogin');
        if (btnCloudLogin) {
          btnCloudLogin.onclick = () => {
            ui.saveText = btoa(unescape(encodeURIComponent(JSON.stringify(state))));
            ui.showSave = true;
            render();
          };
        }

        const btnCloudMenu = document.getElementById('btnCloudMenu');
        if (btnCloudMenu) {
          btnCloudMenu.onclick = () => {
            ui.saveText = btoa(unescape(encodeURIComponent(JSON.stringify(state))));
            ui.showSave = true;
            render();
          };
        }

        const vSel = document.getElementById('villageSelect');
        if (vSel) {
          vSel.onchange = (e) => {
            state.activeVillageId = e.target.value;
            const tv = getActiveVillage();
            ui.mapCenter = { x: tv.x, y: tv.y };
            ui.tradeTargetId = '';
            saveNow();
            render();
          };
        }

        document.getElementById('btnSound').onclick = () => {
          state.soundEnabled = !state.soundEnabled;
          saveNow();
          render();
        };

        document.getElementById('btnSave').onclick = () => {
          ui.saveText = btoa(unescape(encodeURIComponent(JSON.stringify(state))));
          ui.showSave = true;
          render();
        };

        // Eventos do Mercado
        const tradeTargetSel = document.getElementById('tradeTargetSelect');
        if (tradeTargetSel) {
          tradeTargetSel.onchange = (e) => {
            ui.tradeTargetId = e.target.value;
            render();
          };
        }

        document.querySelectorAll('.trade-input').forEach((inp) => {
          inp.oninput = (e) => {
            ui[inp.dataset.tradeinput] = Math.max(0, Math.floor(Number(e.target.value) || 0));
          };
          inp.onchange = () => render();
        });

        document.querySelectorAll('.btn-fill-res').forEach((btn) => {
          btn.onclick = () => {
            const sk = btn.dataset.fillres;
            const resMap = { tradeWood: 'wood', tradeClay: 'clay', tradeIron: 'iron', tradeCrop: 'crop' };
            const rk = resMap[sk];
            const others = ['tradeWood', 'tradeClay', 'tradeIron', 'tradeCrop']
              .filter((k) => k !== sk)
              .reduce((s, k) => s + (Number(ui[k]) || 0), 0);
            const remCap = Math.max(0, cap.merchantCap - others);
            ui[sk] = Math.min(Math.floor(v.resources[rk]), remCap);
            render();
          };
        });

        const btnClearTrade = document.getElementById('btnClearTrade');
        if (btnClearTrade) {
          btnClearTrade.onclick = () => {
            ui.tradeWood = 0;
            ui.tradeClay = 0;
            ui.tradeIron = 0;
            ui.tradeCrop = 0;
            render();
          };
        }

        const btnSendCaravan = document.getElementById('btnSendCaravan');
        if (btnSendCaravan) {
          btnSendCaravan.onclick = () => {
            const dest = state.villages.find((vl) => vl.id === ui.tradeTargetId && vl.id !== v.id);
            if (!dest) return;
            const cargo = {
              wood: Math.floor(Number(ui.tradeWood) || 0),
              clay: Math.floor(Number(ui.tradeClay) || 0),
              iron: Math.floor(Number(ui.tradeIron) || 0),
              crop: Math.floor(Number(ui.tradeCrop) || 0),
            };
            const sum = cargo.wood + cargo.clay + cargo.iron + cargo.crop;
            if (sum <= 0 || sum > cap.merchantCap || !canAfford(v.resources, cargo)) return;
            v.resources = subRes(v.resources, cargo);
            const dist = Math.hypot(dest.x - v.x, dest.y - v.y);
            const bonusSpd = 1 + getAllianceBonuses(state.alliance).merchantPct / 100;
            const travelMs = Math.max(3000, Math.round((Math.max(1, dist) / (20 * bonusSpd)) * 3600000));
            state.tradeCaravans = state.tradeCaravans || [];
            state.tradeCaravans.push({
              id: `car_${Date.now()}`,
              fromVillageId: v.id,
              fromName: v.name,
              toVillageId: dest.id,
              toName: dest.name,
              cargo,
              departedAt: Date.now(),
              arrivesAt: Date.now() + travelMs,
            });
            ui.tradeWood = 0;
            ui.tradeClay = 0;
            ui.tradeIron = 0;
            ui.tradeCrop = 0;
            sfx.play(state.soundEnabled, 'build');
            saveNow();
            setToast(`Caravana enviada para ${dest.name}!`);
          };
        }

        const swapFromSel = document.getElementById('swapFromSel');
        if (swapFromSel) {
          swapFromSel.onchange = (e) => {
            ui.swapFrom = e.target.value;
            render();
          };
        }

        const swapToSel = document.getElementById('swapToSel');
        if (swapToSel) {
          swapToSel.onchange = (e) => {
            ui.swapTo = e.target.value;
            render();
          };
        }

        const swapAmountInput = document.getElementById('swapAmountInput');
        if (swapAmountInput) {
          swapAmountInput.oninput = (e) => {
            ui.swapAmount = Math.max(4, Math.floor(Number(e.target.value) || 4));
          };
          swapAmountInput.onchange = () => render();
        }

        const btnExecuteSwap = document.getElementById('btnExecuteSwap');
        if (btnExecuteSwap) {
          btnExecuteSwap.onclick = () => {
            const amt = Math.max(4, Math.floor(Number(ui.swapAmount) || 200));
            const received = Math.floor(amt * MERCHANT_EXCHANGE_RATE);
            if (ui.swapFrom === ui.swapTo || v.resources[ui.swapFrom] < amt || amt > cap.merchantCap || received <= 0) return;
            const maxDest = ui.swapTo === 'crop' ? cap.granary : cap.warehouse;
            v.resources[ui.swapFrom] -= amt;
            v.resources[ui.swapTo] = Math.min(maxDest, v.resources[ui.swapTo] + received);
            sfx.play(state.soundEnabled, 'build');
            saveNow();
            setToast(`Troca concluída: ${fmtNum(amt)} ${FIELD_CONFIG[ui.swapFrom].label} → ${fmtNum(received)} ${FIELD_CONFIG[ui.swapTo].label}!`);
          };
        }

        // Eventos da Aliança
        const allianceNameIn = document.getElementById('allianceNameIn');
        if (allianceNameIn) allianceNameIn.oninput = (e) => { ui.allianceNameDraft = e.target.value; };

        const allianceTagIn = document.getElementById('allianceTagIn');
        if (allianceTagIn) allianceTagIn.oninput = (e) => { ui.allianceTagDraft = e.target.value.toUpperCase(); };

        const btnCreateAlliance = document.getElementById('btnCreateAlliance');
        if (btnCreateAlliance) {
          btnCreateAlliance.onclick = () => {
            const name = ui.allianceNameDraft.trim();
            const tag = ui.allianceTagDraft.trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
            if (name.length < 3 || tag.length < 2) {
              setToast('Digite um nome (mín. 3 letras) e uma Tag (2 a 4 letras).', true);
              return;
            }
            state.alliance = {
              name,
              tag: tag.slice(0, 4),
              level: 1,
              xp: 0,
              members: [ALLIANCE_NPCS[0]],
              donatedTotal: 0,
            };
            sfx.play(state.soundEnabled, 'victory');
            saveNow();
            setToast(`Aliança [${state.alliance.tag}] ${state.alliance.name} fundada!`);
          };
        }

        document.querySelectorAll('.btn-don-preset').forEach((btn) => {
          btn.onclick = () => {
            ui.donateAmount = Number(btn.dataset.donamt);
            render();
          };
        });

        const btnDonateAlliance = document.getElementById('btnDonateAlliance');
        if (btnDonateAlliance) {
          btnDonateAlliance.onclick = () => {
            if (!state.alliance) return;
            const amt = Math.max(100, Number(ui.donateAmount) || 500);
            const cost = { wood: amt, clay: amt, iron: amt, crop: amt };
            if (!canAfford(v.resources, cost)) return;
            v.resources = subRes(v.resources, cost);
            state.alliance.xp += amt * 4;
            state.alliance.donatedTotal += amt * 4;
            let leveled = false;
            while (state.alliance.level < 10 && state.alliance.xp >= getAllianceNextXp(state.alliance.level)) {
              state.alliance.xp -= getAllianceNextXp(state.alliance.level);
              state.alliance.level += 1;
              leveled = true;
            }
            sfx.play(state.soundEnabled, leveled ? 'victory' : 'build');
            saveNow();
            setToast(
              leveled
                ? `Aliança subiu para o Nível ${state.alliance.level}! Bônus aumentados!`
                : `Doação concluída (+${fmtNum(amt * 4)} XP para a Aliança)!`
            );
          };
        }

        const btnRecruitMember = document.getElementById('btnRecruitMember');
        if (btnRecruitMember) {
          btnRecruitMember.onclick = () => {
            if (!state.alliance) return;
            const nextIdx = state.alliance.members.length;
            if (nextIdx >= ALLIANCE_NPCS.length) return;
            const npc = ALLIANCE_NPCS[nextIdx];
            state.alliance.members.push(npc);
            state.alliance.xp += 350;
            sfx.play(state.soundEnabled, 'build');
            saveNow();
            setToast(`${npc.name} (${npc.role}) juntou-se à sua Aliança!`);
          };
        }

        // Eventos dos Campos e Edifícios
        document.querySelectorAll('.field-btn').forEach((b) => {
          b.onclick = () => {
            ui.selectedFieldId = Number(b.dataset.field);
            render();
          };
        });

        const goCenter = document.getElementById('goCenterCircle');
        if (goCenter) {
          goCenter.onclick = () => {
            ui.tab = 'center';
            render();
          };
        }

        const upField = document.getElementById('btnUpgradeField');
        if (upField) {
          upField.onclick = () => {
            const f = v.fields.find((x) => x.id === ui.selectedFieldId) || v.fields[0];
            const nextLvl = f.level + 1;
            const cost = fieldCost(f.type, nextLvl);
            if (!canAfford(v.resources, cost)) return;
            const sec = fieldSec(f.type, nextLvl, cap.speedMult);
            const tNow = Date.now();
            const start = v.queue.length > 0 ? Math.max(tNow, v.queue[v.queue.length - 1].endsAt) : tNow;
            v.resources = subRes(v.resources, cost);
            v.queue.push({ id: `q_${tNow}`, kind: 'field', targetId: f.id, targetLevel: nextLvl, startedAt: start, endsAt: start + sec * 1000 });
            sfx.play(state.soundEnabled, 'build');
            saveNow();
            render();
          };
        }

        document.querySelectorAll('.slot-btn').forEach((b) => {
          b.onclick = () => {
            ui.selectedSlotId = Number(b.dataset.slot);
            ui.catalogScrollTop = 0;
            render();
          };
        });

        const upBld = document.getElementById('btnUpgradeBld');
        if (upBld) {
          upBld.onclick = () => {
            const s = v.slots.find((x) => x.id === ui.selectedSlotId) || v.slots[0];
            const nextLvl = s.level + 1;
            const cost = bldCost(s.buildingType, nextLvl);
            if (!canAfford(v.resources, cost)) return;
            const sec = bldSec(s.buildingType, nextLvl, cap.speedMult);
            const tNow = Date.now();
            const start = v.queue.length > 0 ? Math.max(tNow, v.queue[v.queue.length - 1].endsAt) : tNow;
            v.resources = subRes(v.resources, cost);
            v.queue.push({ id: `q_${tNow}`, kind: 'building', targetId: s.id, bType: s.buildingType, targetLevel: nextLvl, startedAt: start, endsAt: start + sec * 1000 });
            sfx.play(state.soundEnabled, 'build');
            saveNow();
            render();
          };
        }

        document.querySelectorAll('.btn-build').forEach((b) => {
          b.onclick = () => {
            const bt = b.dataset.build;
            const s = v.slots.find((x) => x.id === ui.selectedSlotId) || v.slots[0];
            const cost = bldCost(bt, 1);
            if (!canAfford(v.resources, cost)) return;
            const sec = bldSec(bt, 1, cap.speedMult);
            const tNow = Date.now();
            const start = v.queue.length > 0 ? Math.max(tNow, v.queue[v.queue.length - 1].endsAt) : tNow;
            v.resources = subRes(v.resources, cost);
            v.queue.push({ id: `q_${tNow}`, kind: 'building', targetId: s.id, bType: bt, targetLevel: 1, startedAt: start, endsAt: start + sec * 1000 });
            sfx.play(state.soundEnabled, 'build');
            saveNow();
            render();
          };
        });

        // Eventos de Recrutamento em Lote no Quartel
        document.querySelectorAll('.unit-qty-input').forEach((inp) => {
          inp.oninput = (e) => {
            const u = inp.dataset.qtyinput;
            ui.trainQty[u] = Math.max(1, Math.min(999, Math.floor(Number(e.target.value) || 1)));
          };
          inp.onchange = () => render();
        });

        document.querySelectorAll('.btn-set-qty').forEach((btn) => {
          btn.onclick = () => {
            const [u, mode] = btn.dataset.setqty.split(':');
            const cfg = UNIT_CONFIG[u];
            if (mode === 'max') {
              const maxA = getMaxAffordableUnits(v.resources, cfg.cost);
              ui.trainQty[u] = Math.max(1, maxA);
            } else if (mode === '1') {
              ui.trainQty[u] = 1;
            } else {
              const add = Number(mode) || 1;
              const cur = Number(ui.trainQty[u]) || 1;
              ui.trainQty[u] = Math.min(999, cur === 1 ? add : cur + add);
            }
            render();
          };
        });

        document.querySelectorAll('.btn-train').forEach((b) => {
          b.onclick = () => {
            const u = b.dataset.train;
            const cfg = UNIT_CONFIG[u];
            const qty = Math.max(1, Math.min(999, Math.floor(Number(ui.trainQty[u]) || 1)));
            const totalCost = multiplyCost(cfg.cost, qty);
            if (!canAfford(v.resources, totalCost)) return;
            const barLvl = v.slots.filter((s) => s.buildingType === 'barracks').reduce((m, s) => Math.max(m, s.level), 0);
            const mult = Math.max(0.4, 1 - Math.max(0, barLvl - 1) * 0.03);
            const tNow = Date.now();
            v.resources = subRes(v.resources, totalCost);
            v.training.push({
              id: `t_${tNow}_${Math.random()}`,
              unitType: u,
              count: qty,
              completedCount: 0,
              startedAt: tNow,
              perUnitMs: Math.max(1000, Math.round(cfg.trainSec * 1000 * mult)),
            });
            ui.trainQty[u] = 1;
            sfx.play(state.soundEnabled, 'build');
            saveNow();
            setToast(`${cfg.icon} Treinando ${qty}x ${cfg.name}!`);
          };
        });

        // Eventos do Mapa
        document.querySelectorAll('.map-move').forEach((b) => {
          b.onclick = () => {
            const [dx, dy] = b.dataset.move.split(',').map(Number);
            ui.mapCenter.x = Math.max(MAP_MIN, Math.min(MAP_MAX, ui.mapCenter.x + dx));
            ui.mapCenter.y = Math.max(MAP_MIN, Math.min(MAP_MAX, ui.mapCenter.y + dy));
            render();
          };
        });

        const mapHome = document.getElementById('mapHome');
        if (mapHome) {
          mapHome.onclick = () => {
            ui.mapCenter = { x: v.x, y: v.y };
            render();
          };
        }

        const radarBox = document.getElementById('radarBox');
        if (radarBox) {
          radarBox.onclick = (e) => {
            const rect = radarBox.getBoundingClientRect();
            const rx = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
            const ry = Math.max(0, Math.min(1, (e.clientY - rect.top) / rect.height));
            ui.mapCenter.x = Math.round(MAP_MIN + rx * (MAP_MAX - MAP_MIN));
            ui.mapCenter.y = Math.round(MAP_MAX - ry * (MAP_MAX - MAP_MIN));
            render();
          };
        }

        document.querySelectorAll('.map-tile').forEach((b) => {
          b.onclick = () => {
            const [tx, ty] = b.dataset.tile.split(',').map(Number);
            const pv = state.villages.find((vl) => vl.x === tx && vl.y === ty);
            ui.inspectedTile = pv ? { x: tx, y: ty, type: 'player_village' } : generateTile(state.worldSeed, tx, ty);
            render();
          };
        });

        const closeTile = document.getElementById('closeTileModal');
        if (closeTile) closeTile.onclick = () => { ui.inspectedTile = null; render(); };

        const btnSettle = document.getElementById('btnSettleHere');
        if (btnSettle) {
          btnSettle.onclick = () => {
            const t = ui.inspectedTile;
            if (!t || t.type !== 'valley' || v.troops.settler < 3) return;
            const dist = Math.hypot(t.x - v.x, t.y - v.y);
            const travelMs = Math.max(4000, Math.round((Math.max(1, dist) / 10) * 3600000));
            v.troops.settler -= 3;
            state.marches.push({
              id: `m_${Date.now()}`,
              originVillageId: v.id,
              mission: 'settle',
              targetX: t.x,
              targetY: t.y,
              targetName: `Fundação (${t.x}|${t.y})`,
              troops: makeTroops({ settler: 3 }),
              status: 'outgoing',
              departedAt: Date.now(),
              arrivesAt: Date.now() + travelMs,
              travelMs,
              loot: { wood: 0, clay: 0, iron: 0, crop: 0 },
            });
            ui.inspectedTile = null;
            sfx.play(state.soundEnabled, 'build');
            saveNow();
            setToast('3 Colonizadores enviados para fundar nova aldeia!');
          };
        }

        const btnAtk = document.getElementById('btnAttackHere');
        if (btnAtk) {
          btnAtk.onclick = () => {
            if (Date.now() < (state.peaceEndsAt || 0)) {
              setToast('Período de paz de 21 dias ativo!', true);
              return;
            }
            const t = ui.inspectedTile;
            const sent = makeTroops({
              legionnaire: v.troops.legionnaire,
              spearman: v.troops.spearman,
              praetorian: v.troops.praetorian,
              equites: v.troops.equites,
              scout: v.troops.scout,
              catapult: v.troops.catapult,
            });
            v.troops.legionnaire = 0;
            v.troops.spearman = 0;
            v.troops.praetorian = 0;
            v.troops.equites = 0;
            v.troops.scout = 0;
            v.troops.catapult = 0;
            const dist = Math.hypot(t.x - v.x, t.y - v.y);
            const travelMs = Math.max(4000, Math.round((Math.max(1, dist) / 14) * 3600000));
            state.marches.push({
              id: `m_${Date.now()}`,
              originVillageId: v.id,
              mission: t.type === 'oasis' ? 'oasis' : 'raid',
              targetX: t.x,
              targetY: t.y,
              targetName: t.type === 'oasis' ? `Oásis (${t.oasis.label})` : t.barbarian.name,
              troops: sent,
              status: 'outgoing',
              departedAt: Date.now(),
              arrivesAt: Date.now() + travelMs,
              travelMs,
              loot: { wood: 0, clay: 0, iron: 0, crop: 0 },
            });
            ui.inspectedTile = null;
            sfx.play(state.soundEnabled, 'build');
            saveNow();
            setToast('Expedição enviada!');
          };
        }

        // Eventos do Modal Cloud Save
        const closeSave = document.getElementById('closeSaveModal');
        if (closeSave) closeSave.onclick = () => { ui.showSave = false; render(); };

        const emailIn = document.getElementById('authEmailInput');
        if (emailIn) emailIn.oninput = (e) => { ui.authEmail = e.target.value; };

        const passIn = document.getElementById('authPassInput');
        if (passIn) passIn.oninput = (e) => { ui.authPassword = e.target.value; };

        const btnEmailLogin = document.getElementById('btnEmailLogin');
        if (btnEmailLogin) btnEmailLogin.onclick = () => signInWithEmail(ui.authEmail, ui.authPassword);

        const btnEmailSignUp = document.getElementById('btnEmailSignUp');
        if (btnEmailSignUp) btnEmailSignUp.onclick = () => signUpWithEmail(ui.authEmail, ui.authPassword);

        const btnLogout = document.getElementById('btnLogoutAccount');
        if (btnLogout) btnLogout.onclick = () => logoutAccount();

        const btnForceSync = document.getElementById('btnForceSync');
        if (btnForceSync) btnForceSync.onclick = () => pushCloudSave(true);

        const btnPullSync = document.getElementById('btnPullSync');
        if (btnPullSync) btnPullSync.onclick = () => pullCloudSave(true);

        const btnCopy = document.getElementById('btnCopySave');
        if (btnCopy) {
          btnCopy.onclick = () => {
            const area = document.getElementById('saveArea');
            area.select();
            document.execCommand('copy');
            setToast('Save Base64 copiado!');
          };
        }

        const btnImp = document.getElementById('btnImportSave');
        if (btnImp) {
          btnImp.onclick = () => {
            try {
              const raw = decodeURIComponent(escape(atob(document.getElementById('saveArea').value.trim())));
              state = stepSimulation(JSON.parse(raw), Date.now()).state;
              const av = getActiveVillage();
              ui.mapCenter = { x: av.x, y: av.y };
              ui.showSave = false;
              saveNow();
              setToast('Save importado e sincronizado!');
            } catch (_) {
              setToast('Código Base64 inválido.', true);
            }
          };
        }

        const btnSeed = document.getElementById('btnNewSeed');
        if (btnSeed) {
          btnSeed.onclick = () => {
            const sVal = document.getElementById('seedInput').value.trim().toUpperCase() || DEFAULT_SEED;
            state = createInitialState(sVal, 'Roma (Capital)');
            const spawnV = state.villages[0];
            ui = {
              ...ui,
              tab: 'fields',
              selectedFieldId: 1,
              selectedSlotId: 1,
              mapCenter: { x: spawnV.x, y: spawnV.y },
              inspectedTile: null,
              toast: null,
              showSave: false,
              saveText: '',
              catalogScrollTop: 0,
              tradeTargetId: '',
              tradeWood: 0,
              tradeClay: 0,
              tradeIron: 0,
              tradeCrop: 0,
            };
            saveNow();
            setToast(`Novo mundo (${sVal}) criado em (${spawnV.x}|${spawnV.y})!`);
          };
        }
      }

      setInterval(() => {
        const res = stepSimulation(state, Date.now());
        state = res.state;
        if (res.event && res.event.toast) {
          sfx.play(state.soundEnabled, res.event.sound);
          ui.toast = { msg: res.event.toast, isErr: res.event.sound === 'alert' || res.event.sound === 'defeat' };
        }
        saveLocal();
        const isEditingForm =
          document.activeElement &&
          (document.activeElement.tagName === 'INPUT' ||
            document.activeElement.tagName === 'SELECT' ||
            document.activeElement.tagName === 'TEXTAREA');
        if (!ui.showSave && !ui.inspectedTile && !isEditingForm) {
          render();
        }
      }, 1000);

      setInterval(() => {
        if (cloud.user) {
          pushCloudSave(false);
        }
      }, 60000);

      window.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden' && cloud.user) {
          pushCloudSave(false);
        }
      });

      render();
    })();
  </script>
