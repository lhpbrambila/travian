              notes.forEach((freq, idx) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = kind === 'alert' ? 'square' : 'triangle';
                osc.frequency.setValueAtTime(freq, now + idx * 0.11);
                gain.gain.setValueAtTime(0.06, now + idx * 0.11);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.11 + 0.18);
                osc.connect(gain);

      // FNV-1a + Mulberry32 determinístico
      function hashSeed(str) {
        let h = 2166136261 >>> 0;
        for (let i = 0; i < str.length; i++) {
          h ^= str.charCodeAt(i);
          h = Math.imul(h, 16777619);
        }
        return h >>> 0;
      }

      function mulberry32(seed) {
        let a = seed >>> 0;
        return function () {
          let t = (a += 0x6d2b79f5);
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      function generateTile(worldSeed, x, y) {
        if (x === 0 && y === 0) return { x: 0, y: 0, type: 'player_village' };
        const rng = mulberry32(hashSeed(`${worldSeed.trim().toUpperCase()}|${x}|${y}`));
        const roll = rng();
        const dist = Math.hypot(x, y);

        if (roll < 0.25) {
          const rRoll = rng();
          const resource =
            rRoll < 0.25 ? 'wood' : rRoll < 0.5 ? 'clay' : rRoll < 0.75 ? 'iron' : 'crop';
          const percent = rng() < 0.28 ? 50 : 25;
          const wildlifeLevel = Math.min(12, Math.max(1, Math.floor(dist / 6.5) + 1));
          return {
            x,
            y,
            type: 'oasis',
            oasis: {
              resource,
              percent,
              label: `+${percent}% ${FIELD_CONFIG[resource].label}`,
              wildlifeLevel,
            },
          };
        }

        if (roll < 0.52) {
          const level = Math.min(15, Math.max(1, Math.floor(dist / 5.5) + Math.floor(rng() * 2) + 1));
          const mult = 0.75 + level * 0.48;
          const tribe = TRIBES[Math.floor(rng() * TRIBES.length)];
          return {
            x,
            y,
            type: 'barbarian',
            barbarian: {
              name: `${tribe} Nv.${level}`,
              level,
              defense: Math.round((85 + level * 68) * (0.9 + rng() * 0.25)),
              loot: {
                wood: Math.round((190 + rng() * 230) * mult),
                clay: Math.round((190 + rng() * 230) * mult),
                iron: Math.round((170 + rng() * 210) * mult),
                crop: Math.round((210 + rng() * 260) * mult),
              },
            },
          };

        const vRoll = rng();
        let distCfg = { wood: 4, clay: 4, iron: 4, crop: 6, label: '4-4-4-6', rare: false };

        else if (vRoll < 0.55) distCfg = { wood: 3, clay: 5, iron: 4, crop: 6, label: '3-5-4-6', rare: false };
        else if (vRoll < 0.73) distCfg = { wood: 4, clay: 3, iron: 5, crop: 6, label: '4-3-5-6', rare: false };

        return { x, y, type: 'valley', valley: distCfg };

      function getCapacities(village) {
        let wBonus = 0,

          cranny = 0,
          mbLvl = 1;
        for (const s of village.slots) {
          if (!s.buildingType || s.level <= 0) continue;

          if (s.buildingType === 'cranny') cranny += Math.round(150 * Math.pow(1.334, s.level - 1));
          if (s.buildingType === 'main_building') mbLvl = Math.max(mbLvl, s.level);
        }
        const speedMult = Math.max(0.5, 1 - Math.min(40, (mbLvl - 1) * 4) / 100);
        return {

          cranny,
          mbLvl,
          speedMult,

      function getHourlyProd(village, worldSeed) {
        const base = { wood: 0, clay: 0, iron: 0, crop: 0 };
        for (const f of village.fields) {
          base[f.type] += FIELD_PROD_TABLE[f.level] || 5;
        }
        const bonus = { wood: 0, clay: 0, iron: 0, crop: 0 };
        for (const key of village.oases || []) {
          const [ox, oy] = key.split(',').map(Number);
          const tile = generateTile(worldSeed, ox, oy);
          if (tile.type === 'oasis' && tile.oasis) {

          }
        }
        let upkeep = 0;
        for (const u of UNIT_ORDER) {
          upkeep += (village.troops[u] || 0) * UNIT_CONFIG[u].upkeep;

        return {
          wood: Math.round(base.wood * (1 + bonus.wood / 100)),
          clay: Math.round(base.clay * (1 + bonus.clay / 100)),
          iron: Math.round(base.iron * (1 + bonus.iron / 100)),
          crop: Math.round(base.crop * (1 + bonus.crop / 100)) - upkeep,
          upkeep,
        };
      }

      function fieldCost(type, lvl) {
        const c = FIELD_CONFIG[type];

          iron: Math.round(c.baseCost.iron * m),

      function fieldSec(type, lvl, speedMult) {

      function bldCost(type, lvl) {
        const c = BUILDING_CONFIG[type];
        const m = Math.pow(1.58, Math.max(0, lvl - 1));
        return {
          wood: Math.round(c.baseCost.wood * m),
          clay: Math.round(c.baseCost.clay * m),
          iron: Math.round(c.baseCost.iron * m),

      function bldSec(type, lvl, speedMult) {
        const c = BUILDING_CONFIG[type];
        return Math.max(3, Math.round(c.baseTime * Math.pow(1.44, Math.max(0, lvl - 1)) * speedMult));

      function canAfford(res, cost) {
        return res.wood >= cost.wood && res.clay >= cost.clay && res.iron >= cost.iron && res.crop >= cost.crop;
      }

      function subRes(res, cost) {
        return {
          wood: Math.max(0, res.wood - cost.wood),
          clay: Math.max(0, res.clay - cost.clay),

      }

      function fmtNum(n) {
        return Math.floor(n).toLocaleString('pt-BR');
      }

      function fmtTime(sec) {
        const s = Math.max(0, Math.floor(sec));
        const h = Math.floor(s / 3600);
        const m = Math.floor((s % 3600) / 60);
        const ss = s % 60;
        if (h > 0) return `${h}h ${String(m).padStart(2, '0')}m ${String(ss).padStart(2, '0')}s`;
        return `${String(m).padStart(2, '0')}:${String(ss).padStart(2, '0')}`;
      }

      function getRegen(barbStates, x, y, nowMs) {
        const entry = barbStates[`${x},${y}`];
        if (!entry) return 1;
        return Math.min(1, Math.max(0.15, (nowMs - entry.lastRaidedAt) / (4 * 3600000)));
      }

      function checkReqs(bType, village) {
        const cfg = BUILDING_CONFIG[bType];
        const reqStatus = cfg.reqs.map((r) => {
          if (r.b) {
            const maxL = village.slots.filter((s) => s.buildingType === r.b).reduce((m, s) => Math.max(m, s.level), 0);
            return { label: r.label, ok: maxL >= r.lvl };
          }
          const maxF = village.fields.filter((f) => f.type === r.f).reduce((m, f) => Math.max(m, f.level), 0);
          return { label: r.label, ok: maxF >= r.lvl };
        });
        const unlocked = reqStatus.every((x) => x.ok);
        const existing = village.slots.filter((s) => s.buildingType === bType);
        let canBuild = unlocked;
        let reason = '';
        if (!unlocked) {
          canBuild = false;
          reason = 'Pré-requisitos pendentes';
        } else if (!cfg.allowMultiple && existing.length > 0) {
          canBuild = false;
          reason = 'Já construído nesta aldeia';
        } else if (cfg.allowMultiple && existing.length > 0 && existing.some((s) => s.level < MAX_BUILDING_LEVEL)) {
          canBuild = false;
          reason = `Evolua o ${cfg.name} atual até Nv. 10`;
        }
        return { unlocked, canBuild, reason, reqStatus };

      function stepSimulation(prev, targetNow) {
        const elapsedMs = Math.max(0, targetNow - prev.lastUpdated) * prev.timeScale;
        if (elapsedMs <= 0) return { state: { ...prev, lastUpdated: targetNow }, event: null };
        const endCursor = prev.lastUpdated + elapsedMs;

        const villages = prev.villages.map((v) => ({
          ...v,
          oases: [...(v.oases || [])],
          resources: { ...v.resources },
          fields: v.fields.map((f) => ({ ...f })),
          slots: v.slots.map((s) => ({ ...s })),
          queue: v.queue.map((q) => ({ ...q })),
          troops: makeTroops(v.troops),
          training: v.training.map((t) => ({ ...t })),
        }));

        const nextBarbarianStates = { ...(prev.barbarianStates || {}) };
        let marches = prev.marches.map((m) => ({ ...m, troops: makeTroops(m.troops), loot: { ...m.loot } }));
        let incoming = prev.incomingAttacks.map((a) => ({ ...a }));
        let nextRaid = prev.nextRaidCheckAt || prev.lastUpdated + 120000;
        const reports = [...prev.reports];
        let event = null;

        // Treino de tropas
        for (const v of villages) {
          const nextTrn = [];
          for (const item of v.training) {
            const done = Math.min(item.count, Math.floor(Math.max(0, endCursor - item.startedAt) / Math.max(250, item.perUnitMs)));
            const newly = Math.max(0, done - item.completedCount);
            if (newly > 0) v.troops[item.unitType] += newly;
            if (done < item.count) nextTrn.push({ ...item, completedCount: done });
          }
          v.training = nextTrn;
        }

        // Marchas e colonização
        const keptMarches = [];
        for (let m of marches) {
          const origin = villages.find((v) => v.id === m.originVillageId) || villages[0];
          if (m.status === 'outgoing' && endCursor >= m.arrivesAt) {
            const tile = generateTile(prev.worldSeed, m.targetX, m.targetY);
            if (m.mission === 'settle' && m.troops.settler >= 3 && tile.type === 'valley') {
              const colNum = villages.length + 1;
              const colName = `Colônia ${colNum} (${m.targetX}|${m.targetY})`;
              villages.push(createVillage(`v_${Date.now()}_${colNum}`, colName, m.targetX, m.targetY, tile.valley));
              reports.unshift({
                id: `r_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
                ts: m.arrivesAt,
                title: `${colName} (${m.targetX}|${m.targetY})`,
                kind: 'settle',
                outcome: 'victory',
                info: `Nova aldeia fundada com sucesso! Selecione-a no topo para alternar.`,
              });
              event = { sound: 'victory', toast: `Nova aldeia fundada: ${colName}!` };
              continue;
            }

            let atkPow = 0;
            for (const u of UNIT_ORDER) atkPow += m.troops[u] * UNIT_CONFIG[u].atk;
            const regen = getRegen(nextBarbarianStates, m.targetX, m.targetY, m.arrivesAt);
            const defPow =
              tile.type === 'barbarian' && tile.barbarian
                ? Math.max(20, Math.round(tile.barbarian.defense * regen))
                : tile.type === 'oasis' && tile.oasis
                ? 70 + tile.oasis.wildlifeLevel * 55
                : 60;

            const ratio = atkPow / Math.max(1, defPow);
            const won = ratio >= 1;
            const lossRate = won ? Math.min(0.65, 0.4 / Math.pow(ratio, 1.3)) : 0.85;
            const surv = makeTroops();
            let carry = 0;
            for (const u of UNIT_ORDER) {
              const lost = Math.min(m.troops[u], Math.round(m.troops[u] * lossRate));
              surv[u] = Math.max(0, m.troops[u] - lost);
              carry += surv[u] * UNIT_CONFIG[u].carry;
            }

            const availLoot =
              tile.type === 'barbarian' && tile.barbarian
                ? {
                    wood: Math.round(tile.barbarian.loot.wood * regen),
                    clay: Math.round(tile.barbarian.loot.clay * regen),
                    iron: Math.round(tile.barbarian.loot.iron * regen),
                    crop: Math.round(tile.barbarian.loot.crop * regen),
                  }
                : { wood: 180, clay: 180, iron: 160, crop: 200 };

            const sumLoot = availLoot.wood + availLoot.clay + availLoot.iron + availLoot.crop;
            const takeRatio = won && sumLoot > 0 ? Math.min(1, carry / sumLoot) : 0;
            const loot = {
              wood: Math.floor(availLoot.wood * takeRatio),
              clay: Math.floor(availLoot.clay * takeRatio),
              iron: Math.floor(availLoot.iron * takeRatio),
              crop: Math.floor(availLoot.crop * takeRatio),
            };

            let oasisMsg = '';
            const key = `${m.targetX},${m.targetY}`;
            if (m.mission === 'oasis' && won && tile.type === 'oasis' && !origin.oases.includes(key) && origin.oases.length < 3) {
              origin.oases.push(key);
              oasisMsg = ` • Oásis conquistado (${tile.oasis.label})!`;
            }
            if (m.mission === 'raid' && won) {
              nextBarbarianStates[key] = { lastRaidedAt: m.arrivesAt };
            }

            reports.unshift({
              id: `r_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
              ts: m.arrivesAt,
              title: `${m.targetName} (${m.targetX}|${m.targetY})`,
              kind: 'battle',
              outcome: won ? 'victory' : 'defeat',
              info: `Ataque ${atkPow} vs Defesa ${defPow}. Saque: +${loot.wood} Mad, +${loot.clay} Bar, +${loot.iron} Fer, +${loot.crop} Cer${oasisMsg}`,
            });
            event = {
              sound: won ? 'victory' : 'defeat',
              toast: won ? `Vitória em (${m.targetX}|${m.targetY})!` : `Derrota em (${m.targetX}|${m.targetY})!`,
            };

            const totalSurv = UNIT_ORDER.reduce((s, u) => s + surv[u], 0);
            if (totalSurv > 0) {
              m = { ...m, status: 'returning', troops: surv, loot, departedAt: m.arrivesAt, arrivesAt: m.arrivesAt + m.travelMs };
            } else {
              continue;
            }
          }

          if (m.status === 'returning' && endCursor >= m.arrivesAt) {
            const cap = getCapacities(origin);
            for (const u of UNIT_ORDER) origin.troops[u] += m.troops[u];
            origin.resources.wood = Math.min(cap.warehouse, origin.resources.wood + m.loot.wood);
            origin.resources.clay = Math.min(cap.warehouse, origin.resources.clay + m.loot.clay);
            origin.resources.iron = Math.min(cap.warehouse, origin.resources.iron + m.loot.iron);
            origin.resources.crop = Math.min(cap.granary, origin.resources.crop + m.loot.crop);
            continue;
          }
          keptMarches.push(m);
        }
        marches = keptMarches;

        // IA Reativa: contra-ataques bárbaros
        const keptInc = [];
        for (const a of incoming) {
          if (endCursor >= a.impactsAt) {
            const tv = villages.find((v) => v.id === a.targetVillageId) || villages[0];
            const cap = getCapacities(tv);
            let defPow = 40;
            for (const u of UNIT_ORDER) defPow += tv.troops[u] * UNIT_CONFIG[u].def;
            const won = defPow >= a.atkPower;
            if (!won) {
              const factor = 0.25;
              tv.resources.wood = Math.max(0, tv.resources.wood - Math.floor(Math.max(0, tv.resources.wood - cap.cranny) * factor));
              tv.resources.clay = Math.max(0, tv.resources.clay - Math.floor(Math.max(0, tv.resources.clay - cap.cranny) * factor));
              tv.resources.iron = Math.max(0, tv.resources.iron - Math.floor(Math.max(0, tv.resources.iron - cap.cranny) * factor));
              tv.resources.crop = Math.max(0, tv.resources.crop - Math.floor(Math.max(0, tv.resources.crop - cap.cranny) * factor));
            }
            reports.unshift({
              id: `r_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
              ts: a.impactsAt,
              title: `Invasão em ${tv.name} (${tv.x}|${tv.y})`,
              kind: 'defense',
              outcome: won ? 'victory' : 'defeat',
              info: won ? `${a.attacker} repelido pela defesa (${defPow} vs ${a.atkPower}).` : `${a.attacker} saqueou parte dos recursos.`,
            });
            event = { sound: won ? 'victory' : 'defeat', toast: won ? `Defesa bem-sucedida em ${tv.name}!` : `${tv.name} sofreu saque inimigo!` };
          } else {
            keptInc.push(a);
          }
        }
        incoming = keptInc;

        if (endCursor >= nextRaid && incoming.length === 0) {
          nextRaid = endCursor + 180000;
          const tv = villages[Math.floor(Math.random() * villages.length)];
          const totalLvls = tv.fields.reduce((s, f) => s + f.level, 0);
          if (totalLvls >= 6) {
            const tribe = TRIBES[Math.floor(Math.random() * TRIBES.length)];
            incoming.push({
              id: `inc_${Date.now()}`,
              targetVillageId: tv.id,
              attacker: tribe,
              atkPower: 70 + totalLvls * 12,
              impactsAt: endCursor + 70000,
            });
            event = { sound: 'alert', toast: `ALERTA: ${tribe} marchando contra ${tv.name}!` };
          }
        }

        // Fila de construção e produção
        for (const v of villages) {
          let cursor = prev.lastUpdated;
          const addProd = (ms) => {
            if (ms <= 0) return;
            const hrs = ms / 3600000;
            const prod = getHourlyProd(v, prev.worldSeed);
            const cap = getCapacities(v);
            v.resources.wood = Math.max(0, Math.min(cap.warehouse, v.resources.wood + prod.wood * hrs));
            v.resources.clay = Math.max(0, Math.min(cap.warehouse, v.resources.clay + prod.clay * hrs));
            v.resources.iron = Math.max(0, Math.min(cap.warehouse, v.resources.iron + prod.iron * hrs));
            v.resources.crop = Math.max(0, Math.min(cap.granary, v.resources.crop + prod.crop * hrs));
          };
          const nextQ = [];
          for (const q of v.queue) {
            if (q.endsAt <= endCursor) {
              if (q.endsAt > cursor) {
                addProd(q.endsAt - cursor);
                cursor = q.endsAt;
              }
              if (q.kind === 'field') {
                const f = v.fields.find((x) => x.id === q.targetId);
                if (f) {
                  f.level = q.targetLevel;
                  if (!event) event = { sound: 'build', toast: `${FIELD_CONFIG[f.type].fieldName} #${f.id} → Nv.${f.level}!` };
                }
              } else {
                const s = v.slots.find((x) => x.id === q.targetId);
                if (s && q.bType) {
                  s.buildingType = q.bType;
                  s.level = q.targetLevel;
                  if (!event) event = { sound: 'build', toast: `${BUILDING_CONFIG[q.bType].name} → Nv.${s.level}!` };
                }
              }
            } else {
              nextQ.push(q);
            }
          }
          if (endCursor > cursor) addProd(endCursor - cursor);
          v.queue = nextQ;
        }

        return {
          state: {
            ...prev,
            villages,
            barbarianStates: nextBarbarianStates,
            incomingAttacks: incoming,
            nextRaidCheckAt: nextRaid,
            marches,
            reports: reports.slice(0, 30),
            lastUpdated: targetNow,
          },
          event,
        };
      }

      // Estado da UI
      let state = createInitialState();
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.villages) && parsed.villages.length > 0) {
            state = stepSimulation(parsed, Date.now()).state;
          }
        }
      } catch (_) {}

      let ui = {
        tab: 'fields',
        selectedFieldId: 1,
        selectedSlotId: 1,
        mapCenter: { x: 0, y: 0 },
        inspectedTile: null,
        toast: null,
        showSave: false,
        saveText: '',
      };

      function setToast(msg, isErr = false) {
        ui.toast = { msg, isErr };
        render();
        setTimeout(() => {
          ui.toast = null;
          render();
        }, 3000);
      }

      function getActiveVillage() {
        return state.villages.find((v) => v.id === state.activeVillageId) || state.villages[0];
      }

      function saveNow() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (_) {}
      }

      function render() {
        const now = Date.now();
        const v = getActiveVillage();
        const cap = getCapacities(v);
        const prod = getHourlyProd(v, state.worldSeed);
        const root = document.getElementById('app');

        const incAtk = state.incomingAttacks[0] || null;

        root.innerHTML = `
          <header class="sticky top-0 z-30 bg-stone-900 text-stone-100 border-b border-stone-700 shadow-lg">
            <div class="max-w-6xl mx-auto px-3 sm:px-6 py-2.5 space-y-2.5">
              <div class="flex flex-wrap items-center justify-between gap-2">
                <div class="flex items-center gap-2 min-w-0">
                  <span class="px-2 py-0.5 rounded bg-amber-600/20 border border-amber-500/50 text-amber-300 text-[11px] font-extrabold">V1.1</span>
                  ${
                    state.villages.length > 1
                      ? `<select id="villageSelect" class="bg-stone-800 border border-amber-500/60 text-amber-100 font-bold text-xs sm:text-sm rounded-lg px-2 py-1">
                          ${state.villages
                            .map((vl) => `<option value="${vl.id}" ${vl.id === v.id ? 'selected' : ''}>${vl.name} (${vl.x}|${vl.y})</option>`)
                            .join('')}
                        </select>`
                      : `<h1 class="font-bold text-sm sm:text-base text-amber-100 truncate">${v.name} (${v.x}|${v.y})</h1>`
                  }
                  <span class="hidden sm:inline-block text-[10px] font-mono px-2 py-0.5 rounded bg-stone-800 border border-stone-700 text-amber-300">Seed: ${state.worldSeed}</span>
                </div>

                <div class="flex items-center gap-1.5">
                  <button id="btnSound" class="px-2 py-1.5 rounded-lg bg-stone-800 hover:bg-stone-700 border border-stone-600 text-xs font-bold cursor-pointer">
                    ${state.soundEnabled ? '🔊 Som' : '🔇 Mudo'}
                  </button>
                  <button id="btnSpeed" class="px-2 py-1.5 rounded-lg border text-xs font-bold cursor-pointer ${state.timeScale > 1 ? 'bg-amber-600 text-white border-amber-400' : 'bg-stone-800 text-stone-300 border-stone-600'}">
                    ⏩ ${state.timeScale}x
                  </button>
                  <button id="btnSave" class="px-2.5 py-1.5 rounded-lg bg-stone-800 hover:bg-stone-700 border border-stone-600 text-amber-200 text-xs font-bold cursor-pointer">
                    💾 Save / Seed
                  </button>
                </div>
              </div>

              ${
                incAtk
                  ? `<div class="px-3 py-2 rounded-xl bg-red-950 border border-red-500 text-red-100 flex items-center justify-between gap-2 text-xs font-bold animate-pulse">
                      <span>⚠️ INVASÃO: ${incAtk.attacker} (Força ~${incAtk.atkPower})</span>
                      <span class="font-mono bg-red-800 px-2 py-0.5 rounded">Impacto: ${fmtTime(Math.max(0, Math.ceil((incAtk.impactsAt - now) / 1000)))}</span>
                    </div>`
                  : ''
              }

              <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
                ${['wood', 'clay', 'iron', 'crop']
                  .map((r) => {
                    const cfg = FIELD_CONFIG[r];
                    const cur = Math.floor(v.resources[r]);
                    const max = r === 'crop' ? cap.granary : cap.warehouse;
                    const p = prod[r];
                    const pct = Math.min(100, (cur / Math.max(1, max)) * 100);
                    return `
                      <div class="rounded-lg p-2 bg-stone-800/90 border border-stone-700">
                        <div class="flex items-center justify-between text-xs mb-1">
                          <span class="font-semibold ${cfg.light}">${cfg.label}</span>
                          <span class="text-[11px] font-bold ${p >= 0 ? 'text-emerald-400' : 'text-red-400'}">${p >= 0 ? '+' : ''}${fmtNum(p)}/h</span>
                        </div>
                        <div class="flex items-baseline justify-between text-xs mb-1">
                          <strong class="text-white text-sm">${fmtNum(cur)}</strong>
                          <span class="text-[11px] text-stone-400">/ ${fmtNum(max)}</span>
                        </div>
                        <div class="w-full h-1.5 bg-stone-950 rounded-full overflow-hidden">
                          <div class="h-full ${cfg.bar}" style="width:${pct}%"></div>
                        </div>
                      </div>
                    `;
                  })
                  .join('')}
              </div>
            </div>
          </header>

          ${
            ui.toast
              ? `<div class="fixed bottom-20 inset-x-0 z-40 flex justify-center px-4 pointer-events-none">
                  <div class="px-4 py-2.5 rounded-xl shadow-xl border text-xs sm:text-sm font-semibold ${ui.toast.isErr ? 'bg-red-950 border-red-600 text-red-100' : 'bg-stone-900 border-amber-500 text-amber-100'}">
                    ${ui.toast.msg}
                  </div>
                </div>`
              : ''
          }

          <main class="flex-1 max-w-6xl w-full mx-auto px-3 sm:px-6 py-4 pb-24">
            ${renderTabContent(v, cap, prod, now)}
          </main>

          <nav class="fixed bottom-0 inset-x-0 z-30 bg-stone-900 text-stone-300 border-t border-stone-700 shadow-2xl">
            <div class="max-w-2xl mx-auto grid grid-cols-5 h-16">
              ${[
                { id: 'fields', label: 'Campos', icon: '🌾' },
                { id: 'center', label: 'Aldeia', icon: '🏛️', badge: v.queue.length > 0 ? `${v.queue.length}/2` : '' },
                { id: 'barracks', label: 'Quartel', icon: '⚔️', badge: state.marches.length > 0 ? `${state.marches.length}` : '' },
                { id: 'map', label: 'Mapa', icon: '🗺️', badge: v.oases.length > 0 ? `${v.oases.length}` : '' },
                { id: 'reports', label: 'Relatórios', icon: '📜', badge: state.reports.length > 0 ? `${state.reports.length}` : '' },
              ]
                .map(
                  (t) => `
                    <button data-tab="${t.id}" class="nav-btn relative flex flex-col items-center justify-center gap-0.5 text-[11px] font-bold cursor-pointer ${
                      ui.tab === t.id ? 'text-amber-400 bg-stone-800 border-t-2 border-amber-400' : 'text-stone-400 hover:text-stone-200'
                    }">
                      <span class="text-base leading-none">${t.icon}</span>
                      <span>${t.label}</span>
                      ${t.badge ? `<span class="absolute top-1.5 right-3 px-1.5 py-0.2 rounded-full bg-amber-500 text-stone-950 text-[9px] font-black">${t.badge}</span>` : ''}
                    </button>
                  `
                )
                .join('')}
            </div>
          </nav>

          ${ui.inspectedTile ? renderTileModal(v, now) : ''}
          ${ui.showSave ? renderSaveModal() : ''}
        `;

        bindEvents(v, cap, now);
      }

      function renderTabContent(v, cap, prod, now) {
        if (ui.tab === 'map') {
          const cx = ui.mapCenter.x;
          const cy = ui.mapCenter.y;
          let gridHtml = '';
          for (let r = 0; r < VIEWPORT_SIZE; r++) {
            const ty = cy + (3 - r);
            for (let c = 0; c < VIEWPORT_SIZE; c++) {
              const tx = cx + (c - 3);
              if (tx < MAP_MIN || tx > MAP_MAX || ty < MAP_MIN || ty > MAP_MAX) {
                gridHtml += `<div class="rounded-lg bg-stone-300/60 border border-stone-300 flex items-center justify-center text-[10px] text-stone-400">—</div>`;
                continue;
              }
              const pv = state.villages.find((vl) => vl.x === tx && vl.y === ty);
              const tile = pv ? { x: tx, y: ty, type: 'player_village' } : generateTile(state.worldSeed, tx, ty);
              const regenPct = tile.type === 'barbarian' ? Math.round(getRegen(state.barbarianStates, tx, ty, now) * 100) : 100;
              let cls = 'bg-emerald-100 hover:bg-emerald-200 border-emerald-300 text-emerald-950';
              let icon = '🌿';
              let sub = 'Vale';
              if (tile.type === 'player_village') {
                cls = 'bg-gradient-to-br from-amber-500 to-amber-700 border-amber-300 text-white ring-2 ring-amber-400';
                icon = '🏰';
                sub = 'Aldeia';
              } else if (tile.type === 'barbarian') {
                cls = 'bg-gradient-to-br from-red-700 to-red-950 border-red-500 text-red-50';
                icon = '⚔️';
                sub = `Nv.${tile.barbarian.level} (${regenPct}%)`;
              } else if (tile.type === 'oasis') {
                cls = 'bg-gradient-to-br from-teal-600 to-cyan-900 border-teal-400 text-teal-50';
                icon = '✨';
                sub = `+${tile.oasis.percent}%`;
              } else if (tile.valley && tile.valley.rare) {
                cls = 'bg-gradient-to-br from-lime-200 to-amber-200 border-amber-500 text-stone-900';
                icon = '🌾';
                sub = tile.valley.label;
              }

              gridHtml += `
                <button data-tile="${tx},${ty}" class="map-tile rounded-lg border p-1 flex flex-col items-center justify-between text-center transition-transform hover:scale-105 cursor-pointer ${cls}">
                  <span class="text-[8px] font-mono opacity-80 leading-none">${tx}|${ty}</span>
                  <span class="text-sm sm:text-base leading-none">${icon}</span>
                  <span class="text-[7px] sm:text-[8px] font-extrabold leading-none truncate w-full">${sub}</span>
                </button>
              `;
            }
          }

          const radarLeft = ((cx - MAP_MIN) / (MAP_MAX - MAP_MIN)) * 100;
          const radarTop = ((MAP_MAX - cy) / (MAP_MAX - MAP_MIN)) * 100;

          return `
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
              <div class="lg:col-span-7 bg-stone-50 rounded-2xl border border-stone-300 p-4 shadow-sm space-y-3">
                <div class="flex flex-wrap items-center justify-between gap-2">
                  <div>
                    <h2 class="font-bold text-stone-800 text-base">Mapa Densificado 151×151 (${cx} | ${cy})</h2>
                    <p class="text-xs text-stone-500">Janela local 7×7 • Coordenadas de -75 a +75</p>
                  </div>
                  <div class="flex items-center gap-1">
                    <button id="mapHome" class="px-2.5 py-1.5 rounded-lg bg-amber-100 hover:bg-amber-200 border border-amber-300 text-amber-900 text-xs font-bold cursor-pointer">📍 Aldeia</button>
                  </div>
                </div>

                <div class="flex flex-col items-center gap-2">
                  <button data-move="0,1" class="map-move w-full max-w-md py-1.5 rounded-lg bg-stone-200 hover:bg-stone-300 text-xs font-bold cursor-pointer">▲ Norte (+Y)</button>
                  <div class="flex items-center gap-1.5 w-full justify-center">
                    <button data-move="-1,0" class="map-move p-2 rounded-lg bg-stone-200 hover:bg-stone-300 text-xs font-bold cursor-pointer">◀</button>
                    <div class="grid grid-cols-7 gap-1 sm:gap-1.5 w-full max-w-md aspect-square bg-emerald-950/15 p-1.5 rounded-xl border border-stone-300">
                      ${gridHtml}
                    </div>
                    <button data-move="1,0" class="map-move p-2 rounded-lg bg-stone-200 hover:bg-stone-300 text-xs font-bold cursor-pointer">▶</button>
                  </div>
                  <button data-move="0,-1" class="map-move w-full max-w-md py-1.5 rounded-lg bg-stone-200 hover:bg-stone-300 text-xs font-bold cursor-pointer">▼ Sul (-Y)</button>
                </div>
              </div>

              <div class="lg:col-span-5 space-y-4">
                <div class="bg-white rounded-xl border border-stone-300 p-4 shadow-sm space-y-2.5">
                  <div class="flex items-center justify-between">
                    <h3 class="font-bold text-sm text-stone-800">Radar Global (151×151)</h3>
                    <span class="text-[11px] font-mono text-stone-500">22.801 quadrantes</span>
                  </div>
                  <div id="radarBox" class="relative w-full h-36 rounded-xl bg-stone-900 border border-stone-700 overflow-hidden cursor-crosshair">
                    <div class="absolute inset-y-0 left-1/2 w-px bg-stone-700 pointer-events-none"></div>
                    <div class="absolute inset-x-0 top-1/2 h-px bg-stone-700 pointer-events-none"></div>
                    ${state.villages
                      .map((vl) => {
                        const l = ((vl.x - MAP_MIN) / (MAP_MAX - MAP_MIN)) * 100;
                        const t = ((MAP_MAX - vl.y) / (MAP_MAX - MAP_MIN)) * 100;
                        return `<div style="left:${l}%;top:${t}%" class="absolute -translate-x-1/2 -translate-y-1/2 w-2.5 h-2.5 rounded-full bg-amber-400 ring-2 ring-amber-200 pointer-events-none"></div>`;
                      })
                      .join('')}

                        <div>
                          <div class="font-bold text-sm text-stone-900">${c.name} <span class="text-[11px] font-normal text-stone-500">(${c.role})</span></div>
                          <div class="text-[11px] text-stone-500">Atq: ${c.atk} • Def: ${c.def} • Vel: ${c.speed} c/h • Carga: ${c.carry} • ${fmtTime(c.trainSec)}</div>
                          <div class="text-[11px] font-semibold text-stone-700 mt-1">Custo: ${c.cost.wood} Mad • ${c.cost.clay} Bar • ${c.cost.iron} Fer • ${c.cost.crop} Cer</div>

                <h3 class="font-bold text-sm text-stone-800">Movimentos de Tropas (${state.marches.length})</h3>
                ${
                  state.marches.length === 0

              </div>
            </div>
          `;

        // Aba Padrão: Campos de Recursos (18 campos)
        const f = v.fields.find((x) => x.id === ui.selectedFieldId) || v.fields[0];
        const fCfg = FIELD_CONFIG[f.type];
        const nextLvl = Math.min(MAX_FIELD_LEVEL, f.level + 1);

        const canUp = f.level < MAX_FIELD_LEVEL && canAfford(v.resources, cost) && v.queue.length < MAX_QUEUE_SIZE;

        return `
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
            <div class="lg:col-span-7 space-y-4">
              <div class="bg-stone-50 rounded-2xl border border-stone-300 p-4 shadow-sm">
                <div class="flex items-center justify-between mb-2">
                  <h2 class="font-bold text-base text-stone-800">Campos de Recursos (${v.name})</h2>
                  <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-amber-100 text-amber-900">Máx Nv.10</span>
                </div>
                <div class="relative w-full max-w-md mx-auto aspect-square rounded-full bg-gradient-to-b from-lime-800/20 via-emerald-800/15 to-amber-900/20 border-4 border-stone-300 my-2">
                  <button id="goCenterCircle" class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-20 h-20 rounded-full bg-stone-800 hover:bg-stone-700 border-4 border-amber-500 text-amber-100 flex flex-col items-center justify-center text-[10px] font-bold shadow-lg cursor-pointer">
                    <span>🏛️</span>
                    <span>Centro</span>
                  </button>

                    const fc = FIELD_CONFIG[fld.type];
                    const sel = fld.id === f.id;
                    return `<button data-field="${fld.id}" style="left:${pos.x}%;top:${pos.y}%" class="field-btn -translate-x-1/2 -translate-y-1/2 absolute w-11 h-11 rounded-full bg-gradient-to-br ${fc.tile} border-2 text-white font-extrabold text-xs shadow flex items-center justify-center cursor-pointer ${sel ? 'ring-4 ring-amber-400 scale-110 z-20' : 'z-10'}">${fld.level}</button>`;
                  }).join('')}
                </div>
              </div>

              <div class="bg-white rounded-xl border border-stone-300 p-4 shadow-sm space-y-2">
                <h3 class="font-bold text-sm text-stone-800">Fila de Construção (${v.queue.length}/${MAX_QUEUE_SIZE})</h3>
                ${
                  v.queue.length === 0
                    ? `<p class="text-xs text-stone-500">Nenhuma obra em andamento.</p>`
                    : v.queue
                        .map((q) => {
                          const rem = Math.max(0, Math.ceil((q.endsAt - now) / 1000));
                          const tot = Math.max(1, (q.endsAt - q.startedAt) / 1000);
                          const pct = Math.min(100, Math.max(0, ((tot - rem) / tot) * 100));
                          const lbl = q.kind === 'field' ? `${FIELD_CONFIG[v.fields.find((x) => x.id === q.targetId).type].fieldName} #${q.targetId}` : BUILDING_CONFIG[q.bType].name;
                          return `<div class="p-2.5 rounded-lg bg-stone-50 border border-stone-200 space-y-1.5"><div class="flex justify-between text-xs"><strong>${lbl} → Nv.${q.targetLevel}</strong><span class="font-mono font-bold">${fmtTime(rem)}</span></div><div class="w-full h-2 bg-stone-200 rounded-full overflow-hidden"><div class="h-full bg-amber-500" style="width:${pct}%"></div></div></div>`;
                        })
                        .join('')
                }
              </div>
            </div>

            <div class="lg:col-span-5 bg-white rounded-2xl border border-stone-300 overflow-hidden shadow-sm">
              <div class="p-4 bg-gradient-to-r ${fCfg.tile} text-white flex items-center justify-between">
                <div><span class="text-xs uppercase opacity-80">Campo #${f.id}</span><h3 class="text-lg font-bold">${fCfg.fieldName}</h3></div>
                <div class="text-2xl font-black">Nv.${f.level}</div>
              </div>
              <div class="p-4 space-y-3">
                <div class="grid grid-cols-2 gap-2 text-xs bg-stone-50 p-3 rounded-xl border border-stone-200">
                  <div><span class="text-stone-500 block">Produção Atual</span><strong>${FIELD_PROD_TABLE[f.level]}/h</strong></div>
                  <div><span class="text-stone-500 block">Próximo Nível</span><strong class="text-emerald-700">${FIELD_PROD_TABLE[nextLvl]}/h</strong></div>
                </div>
                <div class="text-xs space-y-1">
                  <div>Custo Nv.${nextLvl}: <strong>${cost.wood} Mad • ${cost.clay} Bar • ${cost.iron} Fer • ${cost.crop} Cer</strong></div>
                  <div>Tempo de construção: <strong>${fmtTime(sec)}</strong></div>
                </div>
                <button id="btnUpgradeField" ${canUp ? '' : 'disabled'} class="w-full py-3 rounded-xl font-bold text-sm cursor-pointer ${canUp ? 'bg-amber-600 hover:bg-amber-500 text-white' : 'bg-stone-200 text-stone-400 cursor-not-allowed'}">
                  ${f.level >= MAX_FIELD_LEVEL ? 'Nível Máximo' : `Evoluir para Nível ${nextLvl}`}
                </button>
              </div>
            </div>
          </div>
        `;
      }

      function renderTileModal(v, now) {
        const t = ui.inspectedTile;
        const dist = Math.hypot(t.x - v.x, t.y - v.y).toFixed(1);
        const canSettle = t.type === 'valley' && v.troops.settler >= 3;
        const canAttack = (t.type === 'barbarian' || t.type === 'oasis') && (v.troops.legionnaire > 0 || v.troops.equites > 0 || v.troops.spearman > 0);

        return `
          <div id="tileModalBg" class="fixed inset-0 z-50 bg-stone-950/70 flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl max-w-md w-full border border-stone-300 shadow-2xl overflow-hidden">
              <div class="px-5 py-3.5 bg-stone-900 text-white flex items-center justify-between">
                <div><span class="font-mono text-xs text-amber-300">(${t.x} | ${t.y}) • ${dist} campos</span><h3 class="font-bold text-base">${t.type === 'player_village' ? v.name : t.type === 'barbarian' ? t.barbarian.name : t.type === 'oasis' ? `Oásis (${t.oasis.label})` : `Vale Abandonado (${t.valley.label})`}</h3></div>
                <button id="closeTileModal" class="text-stone-400 hover:text-white text-lg font-bold cursor-pointer">✕</button>
              </div>
              <div class="p-5 space-y-3 text-xs">
                ${t.type === 'barbarian' ? `<p class="text-stone-700">Recuperação atual: <strong>${Math.round(getRegen(state.barbarianStates, t.x, t.y, now) * 100)}%</strong> • Saque estimado: ~${t.barbarian.loot.wood} Mad, ~${t.barbarian.loot.clay} Bar, ~${t.barbarian.loot.iron} Fer, ~${t.barbarian.loot.crop} Cer.</p>` : ''}
                ${t.type === 'oasis' ? `<p class="text-teal-900 font-semibold">Conquistar este oásis adiciona ${t.oasis.label} à aldeia ativa.</p>` : ''}
                ${t.type === 'valley' ? `<p class="text-stone-700">Colonizadores disponíveis na aldeia: <strong>${v.troops.settler}/3</strong>.</p>` : ''}
                ${
                  canSettle
                    ? `<button id="btnSettleHere" class="w-full py-2.5 rounded-xl bg-purple-700 hover:bg-purple-600 text-white font-bold cursor-pointer">🚩 Enviar 3 Colonizadores e Fundar Aldeia</button>`
                    : ''
                }
                ${
                  canAttack
                    ? `<button id="btnAttackHere" class="w-full py-2.5 rounded-xl bg-red-700 hover:bg-red-600 text-white font-bold cursor-pointer">⚔️ Enviar Tropas (${t.type === 'oasis' ? 'Conquistar Oásis' : 'Saquear'})</button>`
                    : ''
                }
              </div>
            </div>
          </div>
        `;
      }

      function renderSaveModal() {
        return `
          <div id="saveModalBg" class="fixed inset-0 z-50 bg-stone-950/70 flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl max-w-md w-full border border-stone-300 shadow-2xl overflow-hidden">
              <div class="px-5 py-3.5 bg-stone-900 text-white flex items-center justify-between">
                <h3 class="font-bold text-base">Save Base64 &amp; Novo Mundo</h3>
                <button id="closeSaveModal" class="text-stone-400 hover:text-white text-lg font-bold cursor-pointer">✕</button>
              </div>
              <div class="p-5 space-y-3 text-xs">
                <textarea id="saveArea" rows="3" class="w-full rounded-lg border border-stone-300 p-2 font-mono text-[11px]">${ui.saveText}</textarea>
                <div class="grid grid-cols-2 gap-2">
                  <button id="btnCopySave" class="py-2 rounded-lg bg-stone-800 text-white font-bold cursor-pointer">Copiar Base64</button>
                  <button id="btnImportSave" class="py-2 rounded-lg bg-amber-600 text-white font-bold cursor-pointer">Importar Save</button>
                </div>
                <div class="pt-2 border-t border-stone-200 space-y-2">
                  <label class="font-bold text-stone-600 block">Nova Seed (Mapa 151×151)</label>
                  <div class="flex gap-2">
                    <input id="seedInput" value="${state.worldSeed}" class="flex-1 px-2.5 py-1.5 rounded-lg border border-stone-300 font-mono font-bold uppercase" />
                    <button id="btnNewSeed" class="px-3 py-1.5 rounded-lg bg-emerald-700 text-white font-bold cursor-pointer">Gerar</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      function bindEvents(v, cap, now) {
        document.querySelectorAll('.nav-btn').forEach((btn) => {
          btn.onclick = () => {
            ui.tab = btn.dataset.tab;
            render();
          };
        });

        const vSel = document.getElementById('villageSelect');
        if (vSel) {
          vSel.onchange = (e) => {
            state.activeVillageId = e.target.value;
            const tv = getActiveVillage();
            ui.mapCenter = { x: tv.x, y: tv.y };
            saveNow();
            render();
          };
        }

        document.getElementById('btnSound').onclick = () => {
          state.soundEnabled = !state.soundEnabled;
          saveNow();
          render();
        };

        document.getElementById('btnSpeed').onclick = () => {
          const scales = [1, 5, 20, 60];
          state.timeScale = scales[(scales.indexOf(state.timeScale) + 1) % scales.length];
          saveNow();
          render();
        };

        document.getElementById('btnSave').onclick = () => {
          ui.saveText = btoa(unescape(encodeURIComponent(JSON.stringify(state))));
          ui.showSave = true;
          render();
        };

        document.querySelectorAll('.field-btn').forEach((b) => {
          b.onclick = () => {
            ui.selectedFieldId = Number(b.dataset.field);
            render();
          };
        });

        const goCenter = document.getElementById('goCenterCircle');
        if (goCenter) {
          goCenter.onclick = () => {
            ui.tab = 'center';
            render();
          };
        }

        const upField = document.getElementById('btnUpgradeField');
        if (upField) {
          upField.onclick = () => {
            const f = v.fields.find((x) => x.id === ui.selectedFieldId) || v.fields[0];
            const nextLvl = f.level + 1;
            const cost = fieldCost(f.type, nextLvl);
            if (!canAfford(v.resources, cost)) return;
            const sec = fieldSec(f.type, nextLvl, cap.speedMult);
            const tNow = Date.now();
            const start = v.queue.length > 0 ? Math.max(tNow, v.queue[v.queue.length - 1].endsAt) : tNow;
            v.resources = subRes(v.resources, cost);
            v.queue.push({ id: `q_${tNow}`, kind: 'field', targetId: f.id, targetLevel: nextLvl, startedAt: start, endsAt: start + sec * 1000 });
            sfx.play(state.soundEnabled, 'build');
            saveNow();
            render();
          };
        }

        document.querySelectorAll('.slot-btn').forEach((b) => {
          b.onclick = () => {
            ui.selectedSlotId = Number(b.dataset.slot);
            render();
          };
        });

        const upBld = document.getElementById('btnUpgradeBld');
        if (upBld) {
          upBld.onclick = () => {
            const s = v.slots.find((x) => x.id === ui.selectedSlotId) || v.slots[0];
            const nextLvl = s.level + 1;
            const cost = bldCost(s.buildingType, nextLvl);
            if (!canAfford(v.resources, cost)) return;
            const sec = bldSec(s.buildingType, nextLvl, cap.speedMult);
            const tNow = Date.now();
            const start = v.queue.length > 0 ? Math.max(tNow, v.queue[v.queue.length - 1].endsAt) : tNow;
            v.resources = subRes(v.resources, cost);
            v.queue.push({ id: `q_${tNow}`, kind: 'building', targetId: s.id, bType: s.buildingType, targetLevel: nextLvl, startedAt: start, endsAt: start + sec * 1000 });
            sfx.play(state.soundEnabled, 'build');
            saveNow();
            render();
          };
        }

        document.querySelectorAll('.btn-build').forEach((b) => {
          b.onclick = () => {
            const bt = b.dataset.build;
            const s = v.slots.find((x) => x.id === ui.selectedSlotId) || v.slots[0];
            const cost = bldCost(bt, 1);
            if (!canAfford(v.resources, cost)) return;
            const sec = bldSec(bt, 1, cap.speedMult);
            const tNow = Date.now();
            const start = v.queue.length > 0 ? Math.max(tNow, v.queue[v.queue.length - 1].endsAt) : tNow;
            v.resources = subRes(v.resources, cost);
            v.queue.push({ id: `q_${tNow}`, kind: 'building', targetId: s.id, bType: bt, targetLevel: 1, startedAt: start, endsAt: start + sec * 1000 });
            sfx.play(state.soundEnabled, 'build');
            saveNow();
            render();
          };
        });

        document.querySelectorAll('.btn-train').forEach((b) => {
          b.onclick = () => {
            const u = b.dataset.train;
            const cfg = UNIT_CONFIG[u];
            if (!canAfford(v.resources, cfg.cost)) return;
            const barLvl = v.slots.filter((s) => s.buildingType === 'barracks').reduce((m, s) => Math.max(m, s.level), 0);
            const mult = Math.max(0.4, 1 - Math.max(0, barLvl - 1) * 0.03);
            const tNow = Date.now();
            v.resources = subRes(v.resources, cfg.cost);
            v.training.push({ id: `t_${tNow}_${Math.random()}`, unitType: u, count: 1, completedCount: 0, startedAt: tNow, perUnitMs: Math.max(1000, Math.round(cfg.trainSec * 1000 * mult)) });
            sfx.play(state.soundEnabled, 'build');
            saveNow();
            setToast(`Treinando 1x ${cfg.name}!`);
          };
        });

        document.querySelectorAll('.map-move').forEach((b) => {
          b.onclick = () => {
            const [dx, dy] = b.dataset.move.split(',').map(Number);
            ui.mapCenter.x = Math.max(MAP_MIN, Math.min(MAP_MAX, ui.mapCenter.x + dx));
            ui.mapCenter.y = Math.max(MAP_MIN, Math.min(MAP_MAX, ui.mapCenter.y + dy));
            render();
          };
        });

        const mapHome = document.getElementById('mapHome');
        if (mapHome) {
          mapHome.onclick = () => {
            ui.mapCenter = { x: v.x, y: v.y };
            render();
          };
        }

        const radarBox = document.getElementById('radarBox');
        if (radarBox) {
          radarBox.onclick = (e) => {
            const rect = radarBox.getBoundingClientRect();
            const rx = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
            const ry = Math.max(0, Math.min(1, (e.clientY - rect.top) / rect.height));
            ui.mapCenter.x = Math.round(MAP_MIN + rx * (MAP_MAX - MAP_MIN));
            ui.mapCenter.y = Math.round(MAP_MAX - ry * (MAP_MAX - MAP_MIN));
            render();
          };
        }

        document.querySelectorAll('.map-tile').forEach((b) => {
          b.onclick = () => {
            const [tx, ty] = b.dataset.tile.split(',').map(Number);
            const pv = state.villages.find((vl) => vl.x === tx && vl.y === ty);
            ui.inspectedTile = pv ? { x: tx, y: ty, type: 'player_village' } : generateTile(state.worldSeed, tx, ty);
            render();
          };
        });

        const closeTile = document.getElementById('closeTileModal');
        if (closeTile) closeTile.onclick = () => { ui.inspectedTile = null; render(); };

        const btnSettle = document.getElementById('btnSettleHere');
        if (btnSettle) {
          btnSettle.onclick = () => {
            const t = ui.inspectedTile;
            const dist = Math.hypot(t.x - v.x, t.y - v.y);
            const travelMs = Math.max(4000, Math.round(((Math.max(1, dist) / 10) * 3600000) / state.timeScale));
            v.troops.settler -= 3;
            state.marches.push({
              id: `m_${Date.now()}`,
              originVillageId: v.id,
              mission: 'settle',
              targetX: t.x,
              targetY: t.y,
              targetName: `Fundação (${t.x}|${t.y})`,
              troops: makeTroops({ settler: 3 }),
              status: 'outgoing',
              departedAt: Date.now(),
              arrivesAt: Date.now() + travelMs,
              travelMs,
              loot: { wood: 0, clay: 0, iron: 0, crop: 0 },
            });
            ui.inspectedTile = null;
            sfx.play(state.soundEnabled, 'build');
            saveNow();
            setToast('3 Colonizadores enviados para fundar nova aldeia!');
          };
        }

        const btnAtk = document.getElementById('btnAttackHere');
        if (btnAtk) {
          btnAtk.onclick = () => {
            const t = ui.inspectedTile;
            const sent = makeTroops({
              legionnaire: v.troops.legionnaire,
              spearman: v.troops.spearman,
              equites: v.troops.equites,
              scout: v.troops.scout,
            });
            v.troops.legionnaire = 0;
            v.troops.spearman = 0;
            v.troops.equites = 0;
            v.troops.scout = 0;
            const dist = Math.hypot(t.x - v.x, t.y - v.y);
            const travelMs = Math.max(4000, Math.round(((Math.max(1, dist) / 14) * 3600000) / state.timeScale));
            state.marches.push({
              id: `m_${Date.now()}`,
              originVillageId: v.id,
              mission: t.type === 'oasis' ? 'oasis' : 'raid',
              targetX: t.x,
              targetY: t.y,
              targetName: t.type === 'oasis' ? `Oásis (${t.oasis.label})` : t.barbarian.name,
              troops: sent,
              status: 'outgoing',
              departedAt: Date.now(),
              arrivesAt: Date.now() + travelMs,
              travelMs,
              loot: { wood: 0, clay: 0, iron: 0, crop: 0 },
            });
            ui.inspectedTile = null;
            sfx.play(state.soundEnabled, 'build');
            saveNow();
            setToast('Expedição enviada!');
          };
        }

        const closeSave = document.getElementById('closeSaveModal');
        if (closeSave) closeSave.onclick = () => { ui.showSave = false; render(); };

        const btnCopy = document.getElementById('btnCopySave');
        if (btnCopy) {
          btnCopy.onclick = () => {
            const area = document.getElementById('saveArea');
            area.select();
            document.execCommand('copy');
            setToast('Save Base64 copiado!');
          };
        }

        const btnImp = document.getElementById('btnImportSave');
        if (btnImp) {
          btnImp.onclick = () => {
            try {
              const raw = decodeURIComponent(escape(atob(document.getElementById('saveArea').value.trim())));
              state = stepSimulation(JSON.parse(raw), Date.now()).state;
              ui.showSave = false;
              saveNow();
              setToast('Save importado!');
            } catch (_) {
              setToast('Código Base64 inválido.', true);
            }
          };
        }

        const btnSeed = document.getElementById('btnNewSeed');
        if (btnSeed) {
          btnSeed.onclick = () => {
            const sVal = document.getElementById('seedInput').value.trim().toUpperCase() || DEFAULT_SEED;
            state = createInitialState(sVal, 'Roma (Capital)');
            ui = { tab: 'fields', selectedFieldId: 1, selectedSlotId: 1, mapCenter: { x: 0, y: 0 }, inspectedTile: null, toast: null, showSave: false, saveText: '' };
            saveNow();
            setToast(`Novo mundo gerado com Seed: ${sVal}`);
          };
        }
      }

      setInterval(() => {
        const res = stepSimulation(state, Date.now());
        state = res.state;
        if (res.event && res.event.toast) {
          sfx.play(state.soundEnabled, res.event.sound);
          ui.toast = { msg: res.event.toast, isErr: res.event.sound === 'alert' || res.event.sound === 'defeat' };
        }
        saveNow();
        render();
      }, 1000);

      render();
    })();
  </script>
</body>
</html>
